  <script>
/* js/game/entities.js */
// Entidades do combate: jogador, inimigos, projéteis, coletáveis, partículas, textos e zonas.
(() => {
  const V = (window.V = window.V || {});
  const { R, clamp } = V.Util;

  let uid = 1;

  class Player {
    constructor(stats, x, y) {
      this.stats = stats; // compartilhado com a run (cartas alteram diretamente)
      this.x = x;
      this.y = y;
      this.r = 12;
      this.fireCd = 0;
      this.iframes = 0;
      this.slowT = 0;
      this.dodgeFlash = 0;
      this.face = 1;
      this.walkT = 0;
      this.hurtFlash = 0;
      this.moving = false;
    }

    get hp() {
      return this.stats.hp;
    }

    update(dt, w) {
      const s = this.stats;
      const mv = V.Input.move();
      const slow = this.slowT > 0 ? 0.55 : 1;
      if (this.slowT > 0) this.slowT -= dt;
      const sp = s.moveSpeed * slow;
      const len = Math.hypot(mv.x, mv.y);
      this.moving = len > 0.05;
      if (this.moving) {
        this.x += mv.x * sp * dt;
        this.y += mv.y * sp * dt;
        if (Math.abs(mv.x) > 0.15) this.face = mv.x > 0 ? 1 : -1;
        this.walkT += dt * 9;
      }
      w.resolveMove(this, this.r);
      if (this.iframes > 0) this.iframes -= dt;
      if (this.hurtFlash > 0) this.hurtFlash -= dt;
      if (this.dodgeFlash > 0) this.dodgeFlash -= dt;
      this.fireCd -= dt;
      if (this.fireCd <= 0) {
        const target = w.nearestEnemy(this.x, this.y);
        if (target) {
          this.fireCd = 1 / s.fireRate;
          w.fire(this, target);
        }
      }
    }

    draw(g) {
      const bob = this.moving ? Math.sin(this.walkT) * 1.2 : Math.sin(performance.now() / 420) * 0.8;
      const blink = this.iframes > 0 && Math.floor(this.iframes * 16) % 2 === 0;
      if (blink) return;
      V.Sprites.draw(g, 'player', this.x, this.y - 8 + bob, 52, {
        frame: this.moving && Math.floor(this.walkT) % 2 ? 1 : 0,
        flip: this.face < 0,
      });
      if (this.hurtFlash > 0) {
        g.save();
        g.globalAlpha = Math.min(0.6, this.hurtFlash * 2);
        g.fillStyle = '#ff3b3b';
        g.beginPath();
        g.arc(this.x, this.y - 8, 22, 0, Math.PI * 2);
        g.fill();
        g.restore();
      }
    }
  }

  class Enemy {
    constructor(id, x, y, o = {}) {
      const def = V.Data.monsters[id] || V.Data.bosses[id];
      this.uid = uid++;
      this.id = id;
      this.def = def;
      this.name = def.name;
      this.sprite = def.sprite;
      this.boss = !!o.boss;
      this.champion = !!o.champion;
      this.gen = o.gen || 0;
      const hpMul = o.hpMul || 1;
      this.maxHp = Math.round(def.hp * hpMul);
      this.hp = this.maxHp;
      this.speed = def.speed * (o.speedMul || 1);
      this.dmg = (def.dmg || 12) * (o.dmgMul || 1);
      this.sizeMul = o.sizeMul || 1;
      this.r = def.radius * this.sizeMul;
      this.size = def.size * this.sizeMul;
      this.ai = def.ai;
      this.x = x;
      this.y = y;
      this.vx = 0;
      this.vy = 0;
      this.xp = Math.round(def.xp * (o.xpMul || 1));
      this.gold = Math.round(def.gold * (o.goldMul || 1));
      this.t = 0;
      this.cd = {};
      this.state = 'idle';
      this.stateT = 0.6 + R.next() * 0.8;
      this.flash = 0;
      this.spawnT = o.spawnT == null ? 0.55 : o.spawnT;
      this.spawnTotal = Math.max(0.001, this.spawnT);
      this.frame = 0;
      this.frameT = 0;
      this.dead = false;
      this.face = x < 180 ? 1 : -1;
      this.slowT = 0;
      this.phase = 1;
      this.data = {};
      this.contactCd = 0;
      this.hpBar = 0;
    }

    get active() {
      return !this.dead && this.spawnT <= 0;
    }

    update(dt, w) {
      this.t += dt;
      if (this.flash > 0) this.flash -= dt;
      if (this.contactCd > 0) this.contactCd -= dt;
      if (this.spawnT > 0) {
        this.spawnT -= dt;
        return;
      }
      if (this.slowT > 0) this.slowT -= dt;
      this.frameT += dt;
      if (this.frameT > 0.22) {
        this.frameT = 0;
        this.frame = 1 - this.frame;
      }
      V.AI.update(this, dt, w);
      if (Math.abs(this.vx) > 6) this.face = this.vx > 0 ? 1 : -1;
      this.x += this.vx * dt;
      this.y += this.vy * dt;
      w.resolveMove(this, this.r);
      this.hpBar = V.Util.approach(this.hpBar, this.hp / this.maxHp, dt * 1.5);
    }

    damage(amount) {
      if (this.dead || this.spawnT > 0) return false;
      this.hp -= amount;
      this.flash = 0.12;
      if (this.hp <= 0) {
        this.hp = 0;
        this.dead = true;
        return true;
      }
      return false;
    }

    draw(g) {
      if (this.spawnT > 0) {
        const k = clamp(1 - this.spawnT / this.spawnTotal, 0, 1);
        g.save();
        g.globalAlpha = 0.35 + 0.65 * k;
        g.beginPath();
        g.ellipse(this.x, this.y, this.r * 1.4 * (0.5 + k * 0.5), this.r * 0.6 * (0.5 + k * 0.5), 0, 0, Math.PI * 2);
        g.fillStyle = 'rgba(255,220,140,0.4)';
        g.fill();
        g.restore();
        return;
      }
      const squash = this.ai === 'hop' && this.state === 'hop' ? 1.08 : 1;
      V.Sprites.draw(g, this.sprite, this.x, this.y - (this.boss ? 22 : 0), this.size * squash, {
        frame: this.frame,
        flip: this.face < 0,
        alpha: this.flash > 0 ? 0.7 : 1,
      });
      if (this.flash > 0) {
        g.save();
        g.globalCompositeOperation = 'lighter';
        g.globalAlpha = Math.min(0.5, this.flash * 3);
        V.Sprites.draw(g, this.sprite, this.x, this.y - (this.boss ? 22 : 0), this.size, { frame: this.frame, flip: this.face < 0 });
        g.restore();
      }
      V.AI.drawExtras(this, g);
      if (this.champion) {
        g.save();
        g.strokeStyle = 'rgba(255,207,90,0.8)';
        g.lineWidth = 2;
        g.setLineDash([4, 4]);
        g.beginPath();
        g.arc(this.x, this.y, this.r + 6, this.t, this.t + Math.PI * 2 * 0.9);
        g.stroke();
        g.restore();
      }
      if (this.slowT > 0) {
        g.save();
        g.globalAlpha = 0.5;
        g.strokeStyle = '#e8ecff';
        g.lineWidth = 1.5;
        g.beginPath();
        g.arc(this.x, this.y - this.size * 0.45, 6, 0, Math.PI * 2);
        g.stroke();
        g.restore();
      }
    }
  }

  class Projectile {
    constructor(o) {
      this.x = o.x;
      this.y = o.y;
      this.vx = o.vx;
      this.vy = o.vy;
      this.r = o.r || 6;
      this.dmg = o.dmg || 0;
      this.from = o.from || 'player';
      this.sprite = o.sprite || (this.from === 'player' ? 'arrow' : 'orb_r');
      this.size = o.size || (this.from === 'player' ? 26 : 22);
      this.life = o.life || 2.5;
      this.pierce = o.pierce || 0;
      this.bounces = o.bounces || 0;
      this.homing = o.homing || 0;
      this.explode = o.explode || 0;
      this.crit = !!o.crit;
      this.slow = o.slow || 0;
      this.hits = new Set();
      this.dead = false;
      this.rot = Math.atan2(this.vy, this.vx);
      this.spin = o.spin || 0;
    }

    draw(g) {
      if (this.sprite === 'arrow' || this.sprite === 'arrow_e') {
        V.Sprites.draw(g, this.sprite, this.x, this.y, this.size, { rot: this.rot });
        if (this.crit) {
          g.save();
          g.globalAlpha = 0.5;
          g.fillStyle = '#ffd166';
          g.beginPath();
          g.arc(this.x - Math.cos(this.rot) * 8, this.y - Math.sin(this.rot) * 8, 3, 0, Math.PI * 2);
          g.fill();
          g.restore();
        }
      } else {
        V.Sprites.draw(g, this.sprite, this.x, this.y, this.size, { rot: this.spin ? this.life * this.spin : 0 });
      }
    }
  }

  class Pickup {
    constructor(kind, x, y, value) {
      this.kind = kind;
      this.x = x;
      this.y = y;
      this.value = value || 1;
      this.vx = R.range(-70, 70);
      this.vy = R.range(-90, -30);
      this.life = 14;
      this.t = R.next() * 6;
      this.magnet = false;
      this.dead = false;
    }

    update(dt, w) {
      this.t += dt;
      this.life -= dt;
      if (this.life <= 0) this.dead = true;
      const p = w.player;
      const d = Math.hypot(p.x - this.x, p.y - this.y);
      if (this.vy !== undefined) {
        this.x += this.vx * dt;
        this.y += this.vy * dt;
        this.vx *= 0.9;
        this.vy = (this.vy + 260 * dt) * 0.92;
        if (this.y > w.arena.y1 - 10) {
          this.y = w.arena.y1 - 10;
          this.vy = -this.vy * 0.3;
        }
      }
      if (d < 92 || this.magnet) {
        this.magnet = true;
        const sp = 260 + (92 - Math.min(d, 92)) * 4;
        const dx = p.x - this.x;
        const dy = p.y - this.y;
        const len = Math.max(1, Math.hypot(dx, dy));
        this.x += (dx / len) * sp * dt;
        this.y += (dy / len) * sp * dt;
        if (len < 14) {
          this.dead = true;
          w.collect(this);
        }
      }
    }

    draw(g) {
      const bob = Math.sin(this.t * 5) * 1.5;
      const id = { coin: 'coin', gem: 'gem', heart: 'heart', xp: 'xp', potion: 'potion' }[this.kind];
      V.Sprites.draw(g, id, this.x, this.y + bob, this.kind === 'xp' ? 14 : 18);
    }
  }

  class Particle {
    constructor(x, y, o = {}) {
      this.x = x;
      this.y = y;
      const a = o.angle == null ? R.range(0, Math.PI * 2) : o.angle;
      const sp = o.speed == null ? R.range(40, 160) : o.speed;
      this.vx = Math.cos(a) * sp;
      this.vy = Math.sin(a) * sp;
      this.life = o.life || R.range(0.3, 0.6);
      this.max = this.life;
      this.color = o.color || '#ffd77a';
      this.size = o.size || R.range(2, 4.5);
      this.grav = o.grav == null ? 180 : o.grav;
      this.drag = o.drag == null ? 0.9 : o.drag;
      this.dead = false;
      this.ring = !!o.ring;
    }

    update(dt) {
      this.life -= dt;
      if (this.life <= 0) this.dead = true;
      this.vx *= Math.pow(this.drag, dt * 60);
      this.vy = this.vy * Math.pow(this.drag, dt * 60) + this.grav * dt;
      this.x += this.vx * dt;
      this.y += this.vy * dt;
    }

    draw(g) {
      const k = clamp(this.life / this.max, 0, 1);
      g.globalAlpha = k;
      if (this.ring) {
        g.strokeStyle = this.color;
        g.lineWidth = 2 + (1 - k) * 2;
        g.beginPath();
        g.arc(this.x, this.y, this.size * (1 + (1 - k) * 3), 0, Math.PI * 2);
        g.stroke();
      } else {
        g.fillStyle = this.color;
        g.beginPath();
        g.arc(this.x, this.y, this.size * (0.5 + k * 0.5), 0, Math.PI * 2);
        g.fill();
      }
      g.globalAlpha = 1;
    }
  }

  class FloatText {
    constructor(x, y, text, color, size) {
      this.x = x + R.range(-6, 6);
      this.y = y;
      this.text = text;
      this.color = color || '#fff';
      this.size = size || 14;
      this.life = 0.9;
      this.dead = false;
    }

    update(dt) {
      this.life -= dt;
      this.y -= 38 * dt;
      if (this.life <= 0) this.dead = true;
    }

    draw(g) {
      g.globalAlpha = clamp(this.life / 0.9, 0, 1);
      V.UI.text(g, this.text, this.x, this.y, {
        size: this.size,
        align: 'center',
        weight: 'bold',
        color: this.color,
        stroke: 'rgba(10,5,20,0.85)',
        strokeW: 3,
        shadow: false,
      });
      g.globalAlpha = 1;
    }
  }

  // Zona de perigo com aviso (telegraph). Tipos:
  //  - burst: após o aviso, dano instantâneo se o jogador estiver dentro do raio.
  //  - pool: após o aviso, poça que causa dano periódico (tick) e pode lentificar.
  //  - ring: onda de choque que se expande até o raio e atinge uma vez.
  class Zone {
    constructor(o) {
      this.x = o.x;
      this.y = o.y;
      this.r = o.r;
      this.kind = o.kind || 'burst';
      this.warn = o.warn || 0;
      this.life = o.life || 0.35;
      this.dmg = o.dmg || 0;
      this.tick = o.tick || 0;
      this.slow = o.slow || 0;
      this.color = o.color || '#ff5a5a';
      this.warnTotal = this.warn;
      this.armed = this.warn <= 0;
      this.t = 0;
      this.tickT = 0;
      this.hitDone = false;
      this.curR = 0;
      this.dead = false;
      this.label = o.label || '';
    }

    update(dt, w) {
      this.t += dt;
      const p = w.player;
      if (!this.armed) {
        this.warn -= dt;
        if (this.warn <= 0) {
          this.armed = true;
          this.t = 0;
          if (this.kind === 'burst' && this.dmg) {
            if (Math.hypot(p.x - this.x, p.y - this.y) < this.r + p.r) w.hurtPlayer(this.dmg, this.label || 'Impacto');
          }
          if (this.kind === 'burst') w.shake(4);
          if (this.kind === 'ring') w.shake(3);
        }
        return;
      }
      if (this.kind === 'burst') {
        if (this.t >= this.life) this.dead = true;
        return;
      }
      if (this.kind === 'pool') {
        if (this.t >= this.life) {
          this.dead = true;
          return;
        }
        this.tickT -= dt;
        if (this.tickT <= 0) {
          this.tickT = this.tick || 0.5;
          if (Math.hypot(p.x - this.x, p.y - this.y) < this.r + p.r) {
            w.hurtPlayer(this.dmg, this.label || 'Brasa');
            if (this.slow) p.slowT = Math.max(p.slowT, this.slow);
          }
        }
        return;
      }
      if (this.kind === 'ring') {
        const k = Math.min(1, this.t / this.life);
        this.curR = this.r * k;
        if (!this.hitDone && p.iframes <= 0) {
          const d = Math.hypot(p.x - this.x, p.y - this.y);
          if (d <= this.curR + p.r && d >= this.curR - 18 - p.r) {
            this.hitDone = true;
            w.hurtPlayer(this.dmg, this.label || 'Onda');
          }
        }
        if (this.t >= this.life) this.dead = true;
      }
    }

    draw(g) {
      g.save();
      if (!this.armed) {
        const k = 1 - this.warn / Math.max(0.001, this.warnTotal || this.warn);
        const pulse = 0.5 + 0.5 * Math.sin(this.t * 16);
        g.globalAlpha = 0.85;
        g.strokeStyle = this.color;
        g.lineWidth = 2.5;
        g.setLineDash([6, 5]);
        g.beginPath();
        g.arc(this.x, this.y, this.r, 0, Math.PI * 2);
        g.stroke();
        g.setLineDash([]);
        g.globalAlpha = 0.15 + 0.25 * pulse * (0.3 + k);
        g.fillStyle = this.color;
        g.beginPath();
        g.arc(this.x, this.y, this.r * (0.3 + 0.7 * k), 0, Math.PI * 2);
        g.fill();
      } else if (this.kind === 'burst') {
        const k = 1 - this.t / this.life;
        g.globalAlpha = Math.max(0, k) * 0.7;
        g.fillStyle = this.color;
        g.beginPath();
        g.arc(this.x, this.y, this.r * (1 + (1 - k) * 0.25), 0, Math.PI * 2);
        g.fill();
      } else if (this.kind === 'pool') {
        const fade = Math.min(1, (this.life - this.t) / 0.5);
        g.globalAlpha = (0.35 + 0.15 * Math.sin(this.t * 10)) * fade;
        g.fillStyle = this.color;
        g.beginPath();
        g.arc(this.x, this.y, this.r, 0, Math.PI * 2);
        g.fill();
      } else if (this.kind === 'ring') {
        const k = 1 - this.t / this.life;
        g.globalAlpha = 0.85 * Math.max(0, k);
        g.strokeStyle = this.color;
        g.lineWidth = 12 * Math.max(0.3, k);
        g.beginPath();
        g.arc(this.x, this.y, Math.max(1, this.curR), 0, Math.PI * 2);
        g.stroke();
      }
      g.restore();
    }
  }

  V.Entities = { Player, Enemy, Projectile, Pickup, Particle, FloatText, Zone };
})();

</script>
  <script>
/* js/game/ai.js */
// Comportamentos de inimigos comuns e padrões de chefes (com fases).
// Cada função recebe a entidade "e", o delta "dt" e o mundo "w" (js/game/world.js).
(() => {
  const V = (window.V = window.V || {});
  const { R, clamp } = V.Util;

  function seek(e, tx, ty, sp) {
    const dx = tx - e.x;
    const dy = ty - e.y;
    const d = Math.hypot(dx, dy) || 1;
    e.vx = (dx / d) * sp;
    e.vy = (dy / d) * sp;
    return d;
  }

  function dirTo(e, tx, ty) {
    const dx = tx - e.x;
    const dy = ty - e.y;
    const d = Math.hypot(dx, dy) || 1;
    return { x: dx / d, y: dy / d, d };
  }

  function stop(e, k = 0) {
    e.vx *= k;
    e.vy *= k;
  }

  // Dispara um projétil inimigo em direção a (tx, ty).
  function shootAt(e, w, tx, ty, speed, o = {}) {
    const d = dirTo(e, tx, ty);
    w.spawnProjectile({
      x: e.x,
      y: e.y,
      vx: d.x * speed,
      vy: d.y * speed,
      dmg: o.dmg || e.def.projDmg * (e.dmgMul || 1),
      from: 'enemy',
      sprite: o.sprite || e.def.projectile || 'orb_r',
      size: o.size,
      life: o.life || 3.2,
      homing: o.homing || 0,
      slow: o.slow || 0,
    });
  }

  // Dispara um leque de projéteis em torno de um ângulo.
  function fan(e, w, base, count, spread, speed, o = {}) {
    for (let i = 0; i < count; i++) {
      const a = base + (count === 1 ? 0 : (i / (count - 1) - 0.5) * spread);
      w.spawnProjectile({
        x: e.x,
        y: e.y,
        vx: Math.cos(a) * speed,
        vy: Math.sin(a) * speed,
        dmg: o.dmg || 8,
        from: 'enemy',
        sprite: o.sprite || 'orb_r',
        size: o.size || 22,
        life: o.life || 3.5,
        homing: o.homing || 0,
        slow: o.slow || 0,
      });
    }
  }

  // Ponto aleatório dentro da arena, longe das bordas e de uma posição.
  function randomPointNear(w, cx, cy, minD, maxD) {
    const a = R.range(0, Math.PI * 2);
    const d = R.range(minD, maxD);
    const a2 = w.arena;
    return {
      x: clamp(cx + Math.cos(a) * d, a2.x0 + 30, a2.x1 - 30),
      y: clamp(cy + Math.sin(a) * d, a2.y0 + 30, a2.y1 - 30),
    };
  }

  // ---------- Comuns ----------

  function hop(e, dt, w) {
    const p = w.player;
    e.stateT -= dt;
    if (e.state === 'hop') {
      seek(e, p.x, p.y, e.speed * 2.5);
      if (e.stateT <= 0) {
        e.state = 'wait';
        e.stateT = R.range(0.6, 1.2);
        stop(e, 0.2);
        e.hopLand = true;
      }
    } else {
      stop(e, 0.85);
      if (e.stateT <= 0) {
        e.state = 'hop';
        e.stateT = R.range(0.3, 0.45);
      }
    }
  }

  function flutter(e, dt, w) {
    const p = w.player;
    e.data.retarget = (e.data.retarget || 0) - dt;
    if (e.data.retarget <= 0) {
      e.data.retarget = R.range(0.4, 0.8);
      e.data.ox = R.range(-90, 90);
      e.data.oy = R.range(-90, 90);
    }
    const wob = Math.sin(e.t * 9) * 40;
    seek(e, p.x + e.data.ox, p.y + e.data.oy, e.speed);
    e.vx += wob * 0.3;
  }

  function kite(e, dt, w) {
    const p = w.player;
    const d = dirTo(e, p.x, p.y).d;
    if (d < 130) seek(e, p.x, p.y, -e.speed * 1.1);
    else if (d > 210) seek(e, p.x, p.y, e.speed);
    else {
      const side = e.data.side || (e.data.side = R.pick([-1, 1]));
      const dx = p.x - e.x;
      const dy = p.y - e.y;
      const len = Math.hypot(dx, dy) || 1;
      e.vx = (-dy / len) * e.speed * 0.7 * side;
      e.vy = (dx / len) * e.speed * 0.7 * side;
      if (R.chance(dt * 0.4)) e.data.side = -side;
    }
    e.cd.shoot = (e.cd.shoot == null ? e.def.shootCd : e.cd.shoot) - dt;
    if (e.cd.shoot <= 0 && d < 420 && !e.data.charge) {
      e.data.charge = 0.4;
    }
    if (e.data.charge) {
      e.data.charge -= dt;
      stop(e, 0.3);
      if (e.data.charge <= 0) {
        e.data.charge = 0;
        e.cd.shoot = e.def.shootCd;
        shootAt(e, w, p.x, p.y, e.def.projSpeed);
      }
    }
  }

  function charge(e, dt, w) {
    const p = w.player;
    e.stateT -= dt;
    switch (e.state) {
      case 'idle': {
        const d = dirTo(e, p.x, p.y).d;
        if (d < 260) seek(e, p.x, p.y, e.speed * 0.6);
        else stop(e, 0.9);
        if (d < 200 && e.stateT <= 0) {
          e.state = 'tele';
          e.stateT = 0.75;
          e.data.tele = true;
          e.data.dir = dirTo(e, p.x, p.y);
          w.sfx('telegraph');
        }
        break;
      }
      case 'tele': {
        stop(e, 0.5);
        const d = e.data.dir;
        e.face = d.x >= 0 ? 1 : -1;
        if (e.stateT <= 0) {
          e.state = 'dash';
          e.stateT = 0.55;
          e.data.tele = false;
          e.data.dashDir = { x: d.x, y: d.y };
          e.vx = d.x * e.speed * 5.4;
          e.vy = d.y * e.speed * 5.4;
          w.shake(3);
        }
        break;
      }
      case 'dash': {
        e.vx *= 1 - dt * 0.4;
        e.vy *= 1 - dt * 0.4;
        if (e.stateT <= 0) {
          e.state = 'idle';
          e.stateT = R.range(1.0, 1.6);
          stop(e, 0);
        }
        break;
      }
      default:
        e.state = 'idle';
    }
  }

  function support(e, dt, w) {
    const p = w.player;
    const d = dirTo(e, p.x, p.y).d;
    if (d < 150) seek(e, p.x, p.y, -e.speed);
    else if (d > 210) seek(e, p.x, p.y, e.speed * 0.8);
    else stop(e, 0.85);
    e.cd.shoot = (e.cd.shoot == null ? e.def.shootCd : e.cd.shoot) - dt;
    if (e.cd.shoot <= 0) {
      e.cd.shoot = e.def.shootCd;
      shootAt(e, w, p.x, p.y, e.def.projSpeed, { sprite: 'orb_g' });
    }
    e.cd.heal = (e.cd.heal == null ? 3 : e.cd.heal) - dt;
    if (e.cd.heal <= 0) {
      e.cd.heal = 3;
      for (const o of w.enemies) {
        if (o === e || o.dead || o.spawnT > 0) continue;
        if (Math.hypot(o.x - e.x, o.y - e.y) < 120) {
          o.hp = Math.min(o.maxHp, o.hp + Math.round(o.maxHp * 0.06));
          w.particles(o.x, o.y, { color: '#8cff9a', count: 4, speed: 60 });
        }
      }
      w.particles(e.x, e.y, { color: '#8cff9a', count: 8, ring: true, size: 4 });
    }
  }

  function slam(e, dt, w) {
    const p = w.player;
    seek(e, p.x, p.y, e.speed);
    e.cd.slam = (e.cd.slam == null ? e.def.shootCd : e.cd.slam) - dt;
    if (e.cd.slam <= 0) {
      e.cd.slam = e.def.shootCd;
      w.addZone({
        kind: 'burst', x: p.x, y: p.y, r: 46, warn: 1.0, life: 0.35, dmg: e.dmg * 1.1,
        color: '#ff8a3d', label: 'Esmagamento',
      });
      w.sfx('telegraph');
    }
  }

  function web(e, dt, w) {
    const p = w.player;
    const d = dirTo(e, p.x, p.y).d;
    if (d > 110) seek(e, p.x, p.y, e.speed);
    else seek(e, p.x, p.y, -e.speed * 0.6);
    e.cd.shoot = (e.cd.shoot == null ? e.def.shootCd : e.cd.shoot) - dt;
    if (e.cd.shoot <= 0) {
      e.cd.shoot = e.def.shootCd;
      shootAt(e, w, p.x, p.y, e.def.projSpeed, { sprite: 'web', size: 26, slow: 2.0, dmg: e.def.projDmg });
    }
  }

  function blink(e, dt, w) {
    const p = w.player;
    e.cd.blink = (e.cd.blink == null ? e.def.blinkCd : e.cd.blink) - dt;
    if (e.cd.blink <= 0) {
      e.cd.blink = e.def.blinkCd;
      const q = randomPointNear(w, p.x, p.y, 70, 95);
      w.particles(e.x, e.y, { color: '#9ff3ff', count: 10, ring: false, speed: 110 });
      e.x = q.x;
      e.y = q.y;
      w.particles(e.x, e.y, { color: '#9ff3ff', count: 10, ring: true, size: 5 });
      w.sfx('blink');
      e.cd.blinkHit = 0.6;
    }
    seek(e, p.x, p.y, e.speed * (e.cd.blinkHit > 0 ? 1.8 : 1));
    if (e.cd.blinkHit > 0) e.cd.blinkHit -= dt;
  }

  function caster(e, dt, w) {
    const p = w.player;
    const d = dirTo(e, p.x, p.y).d;
    if (d < 140) seek(e, p.x, p.y, -e.speed);
    else if (d > 200) seek(e, p.x, p.y, e.speed * 0.7);
    else stop(e, 0.8);
    e.cd.shoot = (e.cd.shoot == null ? e.def.shootCd : e.cd.shoot) - dt;
    if (e.cd.shoot <= 0) {
      e.cd.shoot = e.def.shootCd;
      shootAt(e, w, p.x, p.y, e.def.projSpeed, { sprite: 'orb_p', homing: 0.9, size: 22 });
    }
  }

  // ---------- Chefes ----------

  function bossCommon(e, w) {
    const f = e.hp / e.maxHp;
    if (e.phase === 1 && f <= 0.5) {
      e.phase = 2;
      w.bossPhase(e);
    }
    return e.phase;
  }

  function treant(e, dt, w) {
    const p = w.player;
    const ph = bossCommon(e, w);
    const d = dirTo(e, p.x, p.y).d;
    if (d < 120) seek(e, p.x, p.y, -28);
    else seek(e, p.x, p.y, ph === 2 ? 34 : 22);
    e.cd.pat = (e.cd.pat == null ? 1.6 : e.cd.pat) - dt;
    if (e.cd.pat <= 0) {
      e.cd.pat = ph === 2 ? 2.0 : 2.6;
      e.data.n = (e.data.n || 0) + 1;
      const pick = e.data.n % 3;
      if (pick === 0) {
        const base = Math.atan2(p.y - e.y, p.x - e.x);
        fan(e, w, base, ph === 2 ? 7 : 5, 0.95, 165, { dmg: 9, sprite: 'seed', size: 24 });
      } else if (pick === 1) {
        const count = ph === 2 ? 5 : 3;
        for (let i = 0; i < count; i++) {
          const q = randomPointNear(w, p.x, p.y, 0, 90);
          w.addZone({ kind: 'burst', x: q.x, y: q.y, r: 26, warn: 0.95, life: 0.3, dmg: 14, color: '#6bbf55', label: 'Raiz' });
        }
      } else {
        w.addZone({ kind: 'ring', x: e.x, y: e.y, r: 240, warn: 0.9, life: 1.1, dmg: 15, color: '#9be36f', label: 'Abalo' });
        w.sfx('slam');
      }
    }
    if (ph === 2) {
      e.cd.summon = (e.cd.summon == null ? 9 : e.cd.summon) - dt;
      if (e.cd.summon <= 0) {
        e.cd.summon = 9;
        for (let i = 0; i < 2; i++) w.addEnemy('slime', e.x + (i ? 30 : -30), e.y + 40, { spawnT: 0.6, hpMul: 0.8 });
      }
    }
  }

  function king(e, dt, w) {
    const p = w.player;
    const ph = bossCommon(e, w);
    e.data.state = e.data.state || 'approach';
    e.stateT = (e.stateT || 0) - dt;
    switch (e.data.state) {
      case 'approach': {
        seek(e, p.x, p.y, ph === 2 ? 30 : 24);
        e.cd.pat = (e.cd.pat == null ? 1.2 : e.cd.pat) - dt;
        if (e.cd.pat <= 0) {
          e.data.pick = e.data.pick == null ? 0 : (e.data.pick + 1) % 3;
          if (e.data.pick === 0) {
            e.data.state = 'tele';
            e.stateT = 0.8;
            e.data.dir = dirTo(e, p.x, p.y);
            w.sfx('telegraph');
          } else if (e.data.pick === 1) {
            const n = ph === 2 ? 12 : 8;
            for (let i = 0; i < n; i++) {
              const a = (i / n) * Math.PI * 2 + e.t * 0.3;
              w.spawnProjectile({
                x: e.x, y: e.y, vx: Math.cos(a) * 150, vy: Math.sin(a) * 150,
                dmg: 10, from: 'enemy', sprite: 'orb_r', size: 22, life: 3.2,
              });
            }
            w.shake(4);
            e.cd.pat = ph === 2 ? 1.6 : 2.2;
          } else {
            w.addZone({ kind: 'ring', x: e.x, y: e.y, r: 150, warn: 0.9, life: 0.6, dmg: 18, color: '#ff7a2a', label: 'Pisão' });
            e.cd.pat = 2.2;
          }
          if (e.data.pick !== 0) e.cd.pat = e.cd.pat || 1.6;
        }
        if (ph === 2) {
          e.cd.summon = (e.cd.summon == null ? 0 : e.cd.summon) - dt;
          if (e.cd.summon <= 0) {
            e.cd.summon = 9;
            const alive = w.enemies.filter((o) => o.data.minion === e.uid && !o.dead).length;
            if (alive < 2) {
              const m = w.addEnemy('golem', e.x, e.y + 60, { spawnT: 0.7, hpMul: 0.5, sizeMul: 0.8 });
              m.data.minion = e.uid;
            }
          }
        }
        break;
      }
      case 'tele': {
        stop(e, 0.4);
        e.face = e.data.dir.x >= 0 ? 1 : -1;
        if (e.stateT <= 0) {
          e.data.state = 'charge';
          e.stateT = 0.6;
          e.vx = e.data.dir.x * (ph === 2 ? 390 : 340);
          e.vy = e.data.dir.y * (ph === 2 ? 390 : 340);
          e.data.trailT = 0;
          w.shake(3);
        }
        break;
      }
      case 'charge': {
        e.data.trailT -= dt;
        if (e.data.trailT <= 0) {
          e.data.trailT = 0.22;
          w.addZone({ kind: 'pool', x: e.x, y: e.y, r: 24, warn: 0, life: 1.4, dmg: 7, tick: 0.45, color: '#ff7a2a', label: 'Brasa' });
        }
        if (e.stateT <= 0) {
          e.data.state = 'approach';
          e.stateT = 0;
          stop(e, 0);
          e.cd.pat = ph === 2 ? 0.9 : 1.4;
        }
        break;
      }
      default:
        e.data.state = 'approach';
    }
  }

  function eclipse(e, dt, w) {
    const p = w.player;
    const ph = bossCommon(e, w);
    const f = e.hp / e.maxHp;
    // Lâminas orbitando: dano por contato com cooldown próprio.
    const nBlades = ph === 2 ? 4 : 3;
    e.data.blades = [];
    for (let i = 0; i < nBlades; i++) {
      const a = e.t * (ph === 2 ? 2.4 : 1.8) + (i / nBlades) * Math.PI * 2;
      const r = 70 + Math.sin(e.t * 1.3 + i) * 8;
      const bx = e.x + Math.cos(a) * r;
      const by = e.y + Math.sin(a) * r;
      e.data.blades.push({ x: bx, y: by, a });
      w.touchPlayer(bx, by, 11, e.dmg * 0.8, 'blade' + i + e.uid, 0.5);
    }
    // Movimento: segue o jogador de forma tensa, recuando quando perto.
    const d = dirTo(e, p.x, p.y).d;
    if (d < 110) seek(e, p.x, p.y, -30);
    else seek(e, p.x, p.y, 20);
    e.cd.pat = (e.cd.pat == null ? 1.4 : e.cd.pat) - dt;
    if (e.cd.pat <= 0) {
      e.data.n = (e.data.n || 0) + 1;
      const k = e.data.n % 3;
      if (k === 0) {
        // Teleporta e dispara três flechas teleguiadas.
        const q = randomPointNear(w, p.x, p.y, 130, 165);
        w.particles(e.x, e.y, { color: '#ffcf5a', count: 12, speed: 140, ring: false });

/* js/game/arena.js */
// Geração de salas: área de jogo, obstáculos e ondas de inimigos conforme o passo do mapa.
(() => {
  const V = (window.V = window.V || {});
  const { R } = V.Util;

  const ARENA = { x0: 24, y0: 118, x1: 336, y1: 552 };
  const CENTER = { x: 180, y: 470 }; // ponto de entrada do jogador

  // Obstáculos bloqueantes (retângulos quadrados) sem sobreposição e longe do ponto de entrada.
  function makeObstacles(chapter, rng, count) {
    const out = [];
    let guard = 0;
    while (out.length < count && guard++ < 200) {
      const size = rng.int(40, 52);
      const x = rng.range(ARENA.x0 + 30, ARENA.x1 - 30 - size);
      const y = rng.range(ARENA.y0 + 30, ARENA.y1 - 30 - size);
      const cx = x + size / 2;
      const cy = y + size / 2;
      if (Math.hypot(cx - CENTER.x, cy - CENTER.y) < 110) continue;
      if (Math.hypot(cx - CENTER.x, cy - 150) < 90) continue; // deixa a entrada dos chefes aberta
      let ok = true;
      for (const o of out) {
        const ox = o.x + o.w / 2;
        const oy = o.y + o.h / 2;
        if (Math.abs(ox - cx) < (o.w + size) / 2 + 22 && Math.abs(oy - cy) < (o.h + size) / 2 + 22) {
          ok = false;
          break;
        }
      }
      if (!ok) continue;
      out.push({ x, y, w: size, h: size, kind: rng.pick(chapter.obstacles) });
    }
    return out;
  }

  // Quantos obstáculos em cada tipo de sala.
  function obstacleCount(kind, rng) {
    if (kind === 'boss') return rng.int(0, 2);
    if (kind === 'elite') return rng.int(2, 4);
    return rng.int(1, 4);
  }

  // Monta as ondas. Cada onda é uma lista de { id, opts }.
  function makeWaves(chapter, step, kind, rng) {
    const diff = 1 + step * 0.06;
    const pick = () => rng.weighted(chapter.pool).id;
    if (kind === 'boss') {
      return [];
    }
    if (kind === 'elite') {
      const n = 5 + step;
      const first = [];
      for (let i = 0; i < n; i++) first.push({ id: pick(), opts: { hpMul: diff } });
      for (let i = 0; i < 2; i++) {
        first.push({
          id: pick(),
          opts: { hpMul: diff * 2.2, dmgMul: 1.3, sizeMul: 1.25, xpMul: 2.5, goldMul: 2.5, champion: true },
        });
      }
      return [R.shuffle(first)];
    }
    const base = 4 + Math.floor(step * 0.8);
    const waves = [];
    const first = [];
    for (let i = 0; i < base; i++) first.push({ id: pick(), opts: { hpMul: diff } });
    waves.push(first);
    if (step >= 3) {
      const second = [];
      for (let i = 0; i < base - 1; i++) second.push({ id: pick(), opts: { hpMul: diff } });
      waves.push(second);
    }
    return waves;
  }

  V.Arena = { ARENA, CENTER, makeObstacles, obstacleCount, makeWaves };
})();

/* js/game/run.js */
// Estado da run atual: capítulo, passo do mapa, atributos, cartas, XP, ouro e salvamento.
(() => {
  const V = (window.V = window.V || {});
  const { R, makeRng } = V.Util;

  const BASE_STATS = () => ({
    maxHp: 100,
    hp: 100,
    dmg: 10,
    fireRate: 1.5,
    moveSpeed: 128,
    multishot: 1,
    pierce: 0,
    bounces: 0,
    homing: 0,
    explode: 0,
    critChance: 0.08,
    critMult: 2,
    lifesteal: 0,
    armor: 0,
    dodge: 0,
    goldMult: 1,
    xpMult: 1,
    relicBonus: 0,
  });

  // Peso das raridades ao sortear cartas.
  const RARITY_W = { common: 60, rare: 30, epic: 10 };

  const Run = {
    active: false,
    seed: 1,
    rng: null,
    chapter: 0,
    step: 0,
    choices: null,
    stats: null,
    cards: {},
    cardOrder: [],
    level: 1,
    xp: 0,
    gold: 0,
    kills: 0,
    roomsCleared: 0,
    bossesKilled: 0,
    startedAt: 0,

    // Começa uma nova run com os bônus permanentes (Altar) já aplicados.
    start(meta) {
      this.seed = (Math.random() * 1e9) >>> 0;
      this.rng = makeRng(this.seed);
      this.chapter = 0;
      this.step = 0;
      this.choices = null;
      this.stats = BASE_STATS();
      this.cards = {};
      this.cardOrder = [];
      this.level = 1;
      this.xp = 0;
      this.gold = 0;
      this.kills = 0;
      this.roomsCleared = 0;
      this.bossesKilled = 0;
      this.startedAt = Date.now();
      this.active = true;
      V.Meta.applyToStats(this.stats);
      const extra = V.Meta.level('start');
      for (let i = 0; i < extra; i++) this.pickCard(this.randomCards(1, 'common')[0], true);
      this.stats.hp = this.stats.maxHp;
    },

    chapterDef() {
      return V.Data.chapters[this.chapter];
    },

    // Índice global de progresso (usado para calcular relíquias ao morrer).
    progress() {
      return this.chapter * V.Data.STEPS_PER_CHAPTER + this.step;
    },

    // Escolhas do passo atual (sempre duas). Geradas uma vez e mantidas até escolher.
    currentChoices() {
      if (this.choices) return this.choices;
      if (this.isBossNode()) return (this.choices = ['boss']);
      const hurt = this.stats.hp / this.stats.maxHp < 0.6;
      const pool = [
        { w: 40, id: 'combat' },
        { w: this.step >= 1 ? 16 : 0, id: 'elite' },
        { w: 14, id: 'treasure' },
        { w: hurt ? 30 : 12, id: 'rest' },
        { w: this.gold >= 25 ? 22 : 12, id: 'shop' },
      ];
      const first = this.rng.weighted(pool);
      const rest = pool.filter((p) => p.id !== first.id && p.w > 0);
      const second = this.rng.weighted(rest);
      this.choices = this.rng.chance(0.5) ? [first.id, second.id] : [second.id, first.id];
      return this.choices;
    },

    // Avança o mapa após concluir o nó escolhido.
    advance() {
      this.choices = null;
      this.step++;
      if (this.step > V.Data.STEPS_PER_CHAPTER) {
        this.step = 0;
        this.chapter++;
      }
    },

    isBossNode() {
      return this.step >= V.Data.STEPS_PER_CHAPTER;
    },

    isFinalChapterDone() {
      return this.chapter >= V.Data.chapters.length;
    },

    xpNeeded(level) {
      return 8 + level * 6;
    },

    // Adiciona XP e retorna quantos níveis foram ganhos.
    addXp(amount) {
      this.xp += amount * this.stats.xpMult;
      let ups = 0;
      while (this.xp >= this.xpNeeded(this.level)) {
        this.xp -= this.xpNeeded(this.level);
        this.level++;
        ups++;
      }
      return ups;
    },

    addGold(n) {
      this.gold += Math.round(n);
    },

    cardCount(id) {
      return this.cards[id] || 0;
    },

    // Sorteia n cartas diferentes que ainda não atingiram o máximo.
    randomCards(n, onlyRarity) {
      const pool = V.Data.cards.filter((c) => this.cardCount(c.id) < c.max && (!onlyRarity || c.rarity === onlyRarity));
      const out = [];
      let guard = 0;
      while (out.length < n && pool.length && guard++ < 100) {
        const weighted = pool
          .filter((c) => !out.includes(c))
          .map((c) => ({ w: RARITY_W[c.rarity] * (this.cardCount(c.id) ? 0.6 : 1), c }));
        if (!weighted.length) break;
        const pick = this.rng.weighted(weighted).c;
        out.push(pick);
      }
      return out;
    },

    pickCard(card, silent) {
      if (!card) return;
      card.apply(this.stats);
      this.cards[card.id] = (this.cards[card.id] || 0) + 1;
      if (!this.cardOrder.includes(card.id)) this.cardOrder.push(card.id);
      if (!silent) this.stats.hp = Math.min(this.stats.hp, this.stats.maxHp);
    },

    // Salvamento de progresso da run (para "Continuar").
    serialize() {
      return {
        seed: this.seed,
        chapter: this.chapter,
        step: this.step,
        choices: this.choices,
        stats: this.stats,
        cards: this.cards,
        cardOrder: this.cardOrder,
        level: this.level,
        xp: this.xp,
        gold: this.gold,
        kills: this.kills,
        roomsCleared: this.roomsCleared,
        bossesKilled: this.bossesKilled,
      };
    },

    restore(d) {
      if (!d || typeof d !== 'object') return false;
      this.seed = d.seed;
      this.rng = makeRng(d.seed + d.step * 131 + d.chapter * 7919);
      this.chapter = d.chapter;
      this.step = d.step;
      this.choices = d.choices || null;
      this.stats = d.stats;
      this.cards = d.cards || {};
      this.cardOrder = d.cardOrder || [];
      this.level = d.level;
      this.xp = d.xp;
      this.gold = d.gold;
      this.kills = d.kills || 0;
      this.roomsCleared = d.roomsCleared || 0;
      this.bossesKilled = d.bossesKilled || 0;
      this.active = true;
      return true;
    },

    // Relíquias ganhas ao final da run (morte ou vitória).
    relicsOnEnd(victory) {
      let r = Math.floor(this.progress() / 2) + this.bossesKilled * 3;
      if (victory) r += 10;
      r += this.stats.relicBonus * this.bossesKilled;
      return Math.max(1, r);
    },
  };

  V.Run = Run;
})();

/* js/game/meta.js */
// Progresso persistente entre runs: Relíquias, melhorias do Altar, recordes e configurações.
(() => {
  const V = (window.V = window.V || {});
  const { store } = V.Util;

  const KEY = 'meta';

  const Meta = {
    relics: 0,
    levels: {},
    best: { chapter: 0, kills: 0, runs: 0, wins: 0 },

    load() {
      const d = store.get(KEY, null);
      if (d && typeof d === 'object') {
        this.relics = d.relics || 0;
        this.levels = d.levels || {};
        this.best = Object.assign({ chapter: 0, kills: 0, runs: 0, wins: 0 }, d.best || {});
      }
    },

    save() {
      store.set(KEY, { relics: this.relics, levels: this.levels, best: this.best });
    },

    level(id) {
      return this.levels[id] || 0;
    },

    // Aplica as melhorias permanentes aos atributos iniciais de uma run.
    applyToStats(s) {
      s.maxHp += this.bonusHp();
      s.dmg *= 1 + this.level('dmg') * 0.05;
      s.moveSpeed *= 1 + this.level('move') * 0.04;
      s.goldMult *= 1 + this.level('gold') * 0.15;
    },

    bonusHp() {
      return this.level('maxhp') * 10;
    },

    // Compra um nível de melhoria do Altar, se houver Relíquias suficientes.
    buy(id) {
      const def = V.Data.metaUpgrades.find((m) => m.id === id);
      if (!def) return false;
      const lv = this.level(id);
      if (lv >= def.max) return false;
      const cost = V.Data.metaCost(def, lv);
      if (this.relics < cost) return false;
      this.relics -= cost;
      this.levels[id] = lv + 1;
      this.save();
      return true;
    },

    addRelics(n) {
      this.relics += n;
      this.save();
    },
  };

  V.Meta = Meta;
})();

/* js/game/world.js */
// Mundo de combate de uma sala: ondas, colisões, projéteis, drops, chefes e desenho da arena.
(() => {
  const V = (window.V = window.V || {});
  const { R, clamp, dist } = V.Util;
  const { ARENA, CENTER } = V.Arena;
  const E = V.Entities;

  function circleRect(x, y, r, o) {
    const nx = clamp(x, o.x, o.x + o.w);
    const ny = clamp(y, o.y, o.y + o.h);
    const dx = x - nx;
    const dy = y - ny;
    return dx * dx + dy * dy < r * r;
  }

  class World {
    // kind: 'combat' | 'elite' | 'boss'
    constructor(kind) {
      const run = V.Run;
      this.run = run;
      this.kind = kind;
      this.chapter = run.chapterDef();
      this.arena = ARENA;
      this.obstacles = V.Arena.makeObstacles(this.chapter, R, V.Arena.obstacleCount(kind, R));
      this.floor = V.Sprites.floor(this.chapter.theme, ARENA.x1 - ARENA.x0, ARENA.y1 - ARENA.y0, run.seed + run.step * 17 + run.chapter * 101);
      this.player = new E.Player(run.stats, CENTER.x, CENTER.y);
      this.enemies = [];
      this.projectiles = [];
      this.pickups = [];
      this.parts = [];
      this.floats = [];
      this.zones = [];
      this.touchCd = {};
      this.waves = kind === 'boss' ? [] : V.Arena.makeWaves(this.chapter, run.step, kind, R);
      this.waveCd = 0.9;
      this.bossSpawned = false;
      this.state = 'play';
      this.endT = 0;
      this.time = 0;
      this.shakeT = 0;
      this.shakeMag = 0;
      this.levelUps = 0;
      this.roomKills = 0;
      this.bossDown = false;
      this.totalWaves = this.waves.length;
      this.pendingLevelUps = 0;
      this.bossNotice = 0;
      this.lastDmgAt = -10;
    }

    // ---------- Utilidades de mundo (usadas por entidades e IA) ----------

    sfx(name) {
      V.Audio.sfx(name);
    }

    shake(mag) {
      this.shakeMag = Math.max(this.shakeMag, mag);
      this.shakeT = 0.2;
    }

    particles(x, y, o = {}) {
      if (o.ring) {
        this.parts.push(new E.Particle(x, y, { ring: true, color: o.color || '#fff3c4', size: o.size || 6, life: o.life || 0.35, grav: 0 }));
        return;
      }
      const n = o.count || 6;
      for (let i = 0; i < n; i++) {
        this.parts.push(new E.Particle(x, y, { color: o.color, speed: o.speed, life: o.life, size: o.size }));
      }
    }

    floatText(x, y, text, color, size) {
      this.floats.push(new E.FloatText(x, y, text, color, size));
    }

    addZone(o) {
      this.zones.push(new E.Zone(o));
    }

    spawnProjectile(o) {
      this.projectiles.push(new E.Projectile(o));
    }

    addEnemy(id, x, y, opts = {}) {
      const e = new E.Enemy(id, x, y, opts);
      this.enemies.push(e);
      return e;
    }

    // Empurra uma entidade para dentro da arena e para fora dos obstáculos.
    resolveMove(e, r) {
      const a = this.arena;
      e.x = clamp(e.x, a.x0 + r, a.x1 - r);
      e.y = clamp(e.y, a.y0 + r, a.y1 - r);
      for (const o of this.obstacles) {
        const nx = clamp(e.x, o.x, o.x + o.w);
        const ny = clamp(e.y, o.y, o.y + o.h);
        const dx = e.x - nx;
        const dy = e.y - ny;
        const d2 = dx * dx + dy * dy;
        if (d2 < r * r) {
          if (d2 > 0.0001) {
            const d = Math.sqrt(d2);
            const push = r - d;
            e.x += (dx / d) * push;
            e.y += (dy / d) * push;
          } else {
            // Centro dentro do retângulo: empurra pelo menor lado.
            const left = e.x - o.x;
            const right = o.x + o.w - e.x;
            const top = e.y - o.y;
            const bottom = o.y + o.h - e.y;
            const m = Math.min(left, right, top, bottom);
            if (m === left) e.x = o.x - r;
            else if (m === right) e.x = o.x + o.w + r;
            else if (m === top) e.y = o.y - r;
            else e.y = o.y + o.h + r;
          }
        }
      }
    }

    activeEnemies() {
      return this.enemies.filter((e) => !e.dead && e.spawnT <= 0);
    }

    nearestEnemy(x, y) {
      let best = null;
      let bd = Infinity;
      for (const e of this.enemies) {
        if (e.dead || e.spawnT > 0) continue;
        const d = dist(x, y, e.x, e.y);
        if (d < bd) {
          bd = d;
          best = e;
        }
      }
      return best;
    }

    // Disparo do jogador: leque de flechas em direção ao alvo mais próximo.
    fire(p, target) {
      const s = p.stats;
      const a = Math.atan2(target.y - p.y, target.x - p.x);
      const n = s.multishot;
      const speed = 430;
      for (let i = 0; i < n; i++) {
        const off = n === 1 ? 0 : (i - (n - 1) / 2) * 0.16;
        const ang = a + off;
        const crit = R.next() < s.critChance;
        const dmg = s.dmg * (0.92 + R.next() * 0.16) * (crit ? s.critMult : 1);
        this.projectiles.push(
          new E.Projectile({
            x: p.x,
            y: p.y - 6,
            vx: Math.cos(ang) * speed,
            vy: Math.sin(ang) * speed,
            dmg,
            from: 'player',
            crit,
            pierce: s.pierce,
            bounces: s.bounces,
            homing: s.homing,
            explode: s.explode,
            life: 1.6,
          })
        );
      }
      this.sfx('shoot');
    }

    // Dano de contato com cooldown próprio (lâminas, etc.).
    touchPlayer(x, y, r, dmg, key, cd) {
      if ((this.touchCd[key] || 0) > 0) return;
      if (dist(x, y, this.player.x, this.player.y) < r + this.player.r) {
        this.touchCd[key] = cd;
        this.hurtPlayer(dmg, 'Lâmina');
      }
    }

    hurtPlayer(dmg, label) {
      const p = this.player;
      const s = p.stats;
      if (this.state !== 'play' || p.iframes > 0) return;
      if (R.next() < s.dodge) {
        this.floatText(p.x, p.y - 30, 'Esquiva!', '#9fd3ff', 14);
        p.iframes = 0.25;
        return;
      }
      const dealt = Math.max(1, Math.round(dmg * (1 - s.armor)));
      s.hp -= dealt;
      p.iframes = 0.45;
      p.hurtFlash = 0.2;
      this.floatText(p.x, p.y - 30, '-' + dealt, '#ff6b6b', 16);
      this.particles(p.x, p.y, { color: '#ff5a5a', count: 8, speed: 120 });
      this.shake(5);
      this.sfx('hurt');
      this.lastDmgAt = this.time;
      if (s.hp <= 0) {
        s.hp = 0;
        this.state = 'lost';
        this.endT = 1.2;
        this.sfx('die');
      }
    }

    collect(pk) {
      const s = this.player.stats;
      switch (pk.kind) {
        case 'coin':
          this.run.addGold(pk.value);
          this.floatText(pk.x, pk.y - 8, '+' + pk.value, '#ffd54a', 13);
          this.sfx('coin');
          break;
        case 'gem':
          this.run.addGold(pk.value);
          this.floatText(pk.x, pk.y - 8, '+' + pk.value, '#7fd8ff', 14);
          this.sfx('gem');
          break;
        case 'xp': {
          const ups = this.run.addXp(pk.value);
          this.pendingLevelUps += ups;
          this.sfx('xp');
          break;
        }
        case 'heart':
        case 'potion': {
          const before = s.hp;
          s.hp = Math.min(s.maxHp, s.hp + pk.value);
          const got = Math.round(s.hp - before);
          this.floatText(pk.x, pk.y - 8, '+' + (got || pk.value), '#7dff9a', 14);
          this.sfx('heal');
          break;
        }
        default:
          break;
      }
    }

    // Aplica dano a um inimigo e cuida do texto, partículas e morte.
    damageEnemy(e, dmg, crit, x, y) {
      const killed = e.damage(dmg);
      this.floatText(e.x, e.y - e.size * 0.5, String(Math.round(dmg)), crit ? '#ffd166' : '#ffffff', crit ? 20 : 14);
      this.particles(x, y, { color: crit ? '#ffd166' : '#fff3c4', count: crit ? 7 : 4, speed: 110, life: 0.3 });
      if (!killed) this.sfx(crit ? 'crit' : 'hit');
      if (killed) this.kill(e);
    }

    // Explosão de área (flecha incendiária).
    explosion(x, y, r, dmg) {
      this.particles(x, y, { ring: true, color: '#ffb347', size: 6, life: 0.35 });
      for (const e of this.activeEnemies()) {
        if (dist(x, y, e.x, e.y) < r + e.r) this.damageEnemy(e, dmg, false, e.x, e.y);
      }
    }

    kill(e) {
      if (e.killed) return;
      e.killed = true;
      V.AI.onDeath(e, this);
      this.run.kills++;
      this.roomKills++;
      const s = this.player.stats;
      this.particles(e.x, e.y, { color: e.boss ? '#ffd166' : '#ffe9a8', count: e.boss ? 36 : 12, speed: e.boss ? 260 : 140 });
      this.sfx('enemyDie');

      // XP: distribuído em orbes.
      const xpN = clamp(Math.round(e.xp / 2) + 1, 1, 4);
      for (let i = 0; i < xpN; i++) {
        this.pickups.push(new E.Pickup('xp', e.x + R.range(-6, 6), e.y + R.range(-6, 6), e.xp / xpN));
      }
      // Ouro: moedas inteiras.
      const goldAmt = Math.round(e.gold * s.goldMult);
      if (goldAmt > 0) {
        const n = clamp(Math.round(goldAmt / 3) + 1, 1, 4);
        let left = goldAmt;
        for (let i = 0; i < n; i++) {
          const v = i === n - 1 ? left : Math.max(1, Math.floor(goldAmt / n));
          left -= v;
          if (v > 0) this.pickups.push(new E.Pickup('coin', e.x + R.range(-8, 8), e.y + R.range(-8, 8), v));
        }
      }
      if (!e.boss) {
        if (R.chance(0.05)) this.pickups.push(new E.Pickup('heart', e.x, e.y, 15));
        if (R.chance(e.champion ? 0.6 : 0.03)) this.pickups.push(new E.Pickup('potion', e.x, e.y, 25));
        if (R.chance(0.03)) this.pickups.push(new E.Pickup('gem', e.x, e.y, 8));
      }
      if (s.lifesteal > 0) {
        const before = s.hp;
        s.hp = Math.min(s.maxHp, s.hp + s.lifesteal);
        if (s.hp > before) this.floatText(this.player.x, this.player.y - 34, '+' + Math.round(s.hp - before), '#ff7fb0', 13);
      }
      if (e.champion) this.floatText(e.x, e.y - e.size * 0.7, 'Campeão caiu!', '#ffcf5a', 14);
      if (e.boss) this.bossDeath(e);
    }

    bossDeath(e) {
      this.bossDown = true;
      this.run.bossesKilled++;
      this.shake(10);
      this.sfx('slam');
      this.particles(e.x, e.y, { ring: true, color: '#ffd166', size: 14, life: 0.6 });
      for (const o of this.enemies) if (!o.dead && o !== e) o.dead = true;
      this.state = 'won';
      this.endT = 2.4;
    }

    bossPhase(e) {
      this.sfx('roar');
      this.shake(9);
      this.particles(e.x, e.y, { ring: true, color: '#ff7a2a', size: 12, life: 0.5 });
      this.bossNotice = 2.0;
      this.floatText(180, 200, 'FASE 2!', '#ffb347', 26);
    }

    spawnPoint() {
      const a = this.arena;
      for (let i = 0; i < 40; i++) {
        const x = R.range(a.x0 + 30, a.x1 - 30);
        const y = R.range(a.y0 + 30, a.y1 - 70);
        if (dist(x, y, this.player.x, this.player.y) < 130) continue;
        if (this.obstacles.some((o) => circleRect(x, y, 14, o))) continue;
        return { x, y };
      }
      return { x: 180, y: 200 };
    }

    spawnBoss() {
      const b = this.addEnemy(this.chapter.boss, 180, 212, { spawnT: 1.2 });
      this.bossRef = b;
      this.bossNotice = 2.4;
      this.sfx('roar');
      this.floatText(180, 260, this.bossName(b), '#ffd166', 18);
    }

    bossName(b) {
      return b.name;
    }

    update(dt) {
      if (this.state !== 'play') {
        this.endT -= dt;
        this.updateParticles(dt);
        this.updateFx(dt);
        return;
      }
      this.time += dt;
      if (this.shakeT > 0) {
        this.shakeT -= dt;
        if (this.shakeT <= 0) this.shakeMag = 0;
      }
      if (this.bossNotice > 0) this.bossNotice -= dt;
      for (const k in this.touchCd) this.touchCd[k] -= dt;

      this.player.update(dt, this);
      for (const e of this.enemies) if (!e.dead) e.update(dt, this);

      // Dano de contato com inimigos.
      const pl = this.player;
      for (const e of this.enemies) {
        if (e.dead || e.spawnT > 0 || e.contactCd > 0) continue;
        if (dist(e.x, e.y, pl.x, pl.y) < e.r + pl.r) {
          e.contactCd = 0.8;
          this.hurtPlayer(e.dmg, e.name);
        }
      }

      for (const z of this.zones) z.update(dt, this);
      this.zones = this.zones.filter((z) => !z.dead);

      this.updateProjectiles(dt);
      this.updateSpawn(dt);

      for (const pk of this.pickups) pk.update(dt, this);
      this.pickups = this.pickups.filter((p) => !p.dead);

      this.updateParticles(dt);
      this.updateFx(dt);
      this.enemies = this.enemies.filter((e) => !e.dead);

      if (this.kind !== 'boss' && this.waves.length === 0 && this.enemies.length === 0 && this.state === 'play') {
        this.state = 'won';
        this.endT = 0.9;
        this.sfx('roomClear');
      }
      if (this.kind === 'boss' && this.bossSpawned && !this.bossDown && this.enemies.length === 0) {
        // Segurança: chefe removido sem morrer não deve travar a sala.
        this.state = 'won';
        this.endT = 0.5;
      }
    }

    updateProjectiles(dt) {
      const a = this.arena;
      for (const p of this.projectiles) {
        if (p.dead) continue;
        p.life -= dt;
        if (p.life <= 0) {
          p.dead = true;
          continue;
        }
        // Mira teleguiada.
        if (p.homing > 0) {
          let tx = null;
          let ty = null;
          if (p.from === 'player') {
            let best = null;
            let bd = 240;
            for (const e of this.enemies) {
              if (e.dead || e.spawnT > 0 || p.hits.has(e.uid)) continue;
              const d = dist(p.x, p.y, e.x, e.y);
              if (d < bd) {
                bd = d;
                best = e;
              }
            }
            if (best) {
              tx = best.x;
              ty = best.y;
            }
          } else {
            tx = this.player.x;
            ty = this.player.y;
          }
          if (tx !== null) {
            const sp = Math.hypot(p.vx, p.vy);
            const cur = Math.atan2(p.vy, p.vx);
            const want = Math.atan2(ty - p.y, tx - p.x);
            let diff = want - cur;
            while (diff > Math.PI) diff -= Math.PI * 2;
            while (diff < -Math.PI) diff += Math.PI * 2;
            const turn = clamp(diff, -p.homing * 3.2 * dt, p.homing * 3.2 * dt);
            p.vx = Math.cos(cur + turn) * sp;
            p.vy = Math.sin(cur + turn) * sp;
          }
        }
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.rot = Math.atan2(p.vy, p.vx);

        // Bordas da arena.
        if (p.from === 'player') {
          if (p.x < a.x0 || p.x > a.x1) {
            if (p.bounces > 0) {
              p.bounces--;
              p.vx = -p.vx;
              p.x = clamp(p.x, a.x0 + 1, a.x1 - 1);
              this.particles(p.x, p.y, { color: '#cfe8ff', count: 3, speed: 60, life: 0.2 });
            } else p.dead = true;
          }
          if (p.y < a.y0 || p.y > a.y1) {
            if (p.bounces > 0) {
              p.bounces--;
              p.vy = -p.vy;
              p.y = clamp(p.y, a.y0 + 1, a.y1 - 1);
              this.particles(p.x, p.y, { color: '#cfe8ff', count: 3, speed: 60, life: 0.2 });
            } else p.dead = true;
          }
        } else if (p.x < a.x0 - 20 || p.x > a.x1 + 20 || p.y < a.y0 - 20 || p.y > a.y1 + 20) {
          p.dead = true;
        }
        if (p.dead) continue;

        // Obstáculos.
        for (const o of this.obstacles) {
          if (!circleRect(p.x, p.y, p.r, o)) continue;
          if (p.from === 'player' && p.bounces > 0) {
            p.bounces--;
            const dl = Math.min(Math.abs(p.x - o.x), Math.abs(p.x - (o.x + o.w)));
            const dt2 = Math.min(Math.abs(p.y - o.y), Math.abs(p.y - (o.y + o.h)));
            if (dl < dt2) p.vx = -p.vx;
            else p.vy = -p.vy;
            p.x += p.vx * dt * 2;
            p.y += p.vy * dt * 2;
            this.particles(p.x, p.y, { color: '#cfe8ff', count: 3, speed: 60, life: 0.2 });
          } else {
            p.dead = true;
            this.particles(p.x, p.y, { color: '#c9b79a', count: 4, speed: 70, life: 0.25 });
          }
          break;
        }
        if (p.dead) continue;

        if (p.from === 'player') this.playerProjectileHits(p);
        else this.enemyProjectileHits(p);
      }
      this.projectiles = this.projectiles.filter((p) => !p.dead);
    }

    playerProjectileHits(p) {
      for (const e of this.enemies) {
        if (e.dead || e.spawnT > 0 || p.hits.has(e.uid)) continue;
        if (dist(p.x, p.y, e.x, e.y) < e.r + p.r) {
          p.hits.add(e.uid);
          this.damageEnemy(e, p.dmg, p.crit, p.x, p.y);
          if (p.explode > 0) this.explosion(p.x, p.y, 46, p.dmg * p.explode);
          if (p.pierce > 0 && p.hits.size <= p.pierce) continue;
          p.dead = true;
          return;
        }
      }
    }

    enemyProjectileHits(p) {
      const pl = this.player;
      if (dist(p.x, p.y, pl.x, pl.y) < pl.r + p.r) {
        this.hurtPlayer(p.dmg, 'Projétil');
        if (p.slow) pl.slowT = Math.max(pl.slowT, p.slow);
        p.dead = true;
      }
    }

    updateSpawn(dt) {
      if (this.kind === 'boss') {
        if (!this.bossSpawned) {
          this.waveCd -= dt;
          if (this.waveCd <= 0) {
            this.bossSpawned = true;
            this.spawnBoss();
          }
        }
        return;
      }
      if (this.waveCd > 0) {
        this.waveCd -= dt;
        return;
      }
      const living = this.enemies.some((e) => !e.dead);
      if (!living && this.waves.length) {
        const wave = this.waves.shift();
        wave.forEach((u, i) => {
          const pt = this.spawnPoint();
          this.addEnemy(u.id, pt.x, pt.y, Object.assign({}, u.opts, { spawnT: 0.55 + i * 0.09 }));
        });
        this.waveCd = 0.4;
      }
    }

    updateParticles(dt) {
      for (const p of this.parts) p.update(dt);
      this.parts = this.parts.filter((p) => !p.dead);
    }

    updateFx(dt) {
      for (const f of this.floats) f.update(dt);
      this.floats = this.floats.filter((f) => !f.dead);
    }

    // ---------- Desenho ----------

    drawArena(g) {
      const a = this.arena;
      const th = V.Sprites.THEMES[this.chapter.theme];
      // moldura de parede
      g.fillStyle = th.wall;
      V.UI.roundRect(g, a.x0 - 16, a.y0 - 16, a.x1 - a.x0 + 32, a.y1 - a.y0 + 32, 16);
      g.fill();
      g.fillStyle = th.wallTop;
      V.UI.roundRect(g, a.x0 - 12, a.y0 - 12, a.x1 - a.x0 + 24, 8, 4);
      g.fill();
      // piso
      g.save();
      V.UI.roundRect(g, a.x0, a.y0, a.x1 - a.x0, a.y1 - a.y0, 8);
      g.clip();
      g.drawImage(this.floor, a.x0, a.y0, a.x1 - a.x0, a.y1 - a.y0);
      // sombra interna (profundidade)
      const shade = g.createLinearGradient(0, a.y0, 0, a.y0 + 60);
      shade.addColorStop(0, 'rgba(0,0,0,0.35)');
      shade.addColorStop(1, 'rgba(0,0,0,0)');
      g.fillStyle = shade;
      g.fillRect(a.x0, a.y0, a.x1 - a.x0, 60);
      const vig = g.createRadialGradient(180, 335, 120, 180, 335, 260);
      vig.addColorStop(0, 'rgba(0,0,0,0)');
      vig.addColorStop(1, 'rgba(0,0,0,0.45)');
      g.fillStyle = vig;
      g.fillRect(a.x0, a.y0, a.x1 - a.x0, a.y1 - a.y0);
      g.restore();
      // obstáculos
      for (const o of this.obstacles) {
        const img = V.Sprites.obstacle(this.chapter.theme, o.kind, o.w, o.h);
        g.drawImage(img, o.x, o.y, o.w, o.h);
      }
    }

    draw(g) {
      const sx = this.shakeT > 0 ? R.range(-this.shakeMag, this.shakeMag) : 0;
      const sy = this.shakeT > 0 ? R.range(-this.shakeMag, this.shakeMag) : 0;
      g.save();
      g.translate(sx, sy);
      this.drawArena(g);
      for (const z of this.zones) z.draw(g);
      for (const pk of this.pickups) pk.draw(g);
      const ents = this.enemies.slice().concat([this.player]).sort((a, b) => a.y - b.y);
      for (const en of ents) {
        if (en === this.player) en.draw(g);
        else en.draw(g);
      }
      for (const p of this.projectiles) p.draw(g);
      for (const p of this.parts) p.draw(g);
      for (const f of this.floats) f.draw(g);
      g.restore();
    }
  }

  V.World = World;
})();

</script>

/* js/scenes/hud.js */
// HUD compartilhado: vida, ouro, nível e cartas adquiridas (topo da tela).
(() => {
  const V = (window.V = window.V || {});
  const { UI } = V;

  const HUD = {
    draw(g, s, level, xp, need, gold, cardOrder, cards) {
      // Painel de fundo
      g.fillStyle = 'rgba(8,5,16,0.72)';
      g.fillRect(0, 0, 360, 96);
      g.fillStyle = 'rgba(255,215,122,0.25)';
      g.fillRect(0, 95, 360, 1);

      // Vida
      const hpF = s.hp / s.maxHp;
      UI.bar(g, 16, 12, 186, 18, hpF, '#ff6b6b', '#c81d3a', 'rgba(0,0,0,0.55)');
      UI.text(g, `${Math.ceil(s.hp)} / ${s.maxHp}`, 109, 14, {
        size: 12, align: 'center', weight: 'bold', shadow: false, color: '#fff', stroke: 'rgba(0,0,0,0.6)', strokeW: 3,
      });

      // Ouro
      V.UI.icon(g, 'gold', 224, 21, 15);
      UI.text(g, String(gold), 236, 12, { size: 16, weight: 'bold', color: '#ffd54a' });

      // Nível e XP
      UI.text(g, `Nv ${level}`, 300, 10, { size: 13, weight: 'bold', color: '#c9b6ff' });
      UI.bar(g, 300, 30, 48, 6, need > 0 ? xp / need : 0, '#8ff0dc', '#2aa88f', 'rgba(0,0,0,0.5)');

      // Cartas adquiridas
      let x = 18;
      const shown = cardOrder.slice(0, 10);
      for (const id of shown) {
        const def = V.Data.cards.find((c) => c.id === id);
        if (!def) continue;
        const col = V.Data.rarityColor[def.rarity];
        g.beginPath();
        g.arc(x + 8, 62, 9, 0, Math.PI * 2);
        g.fillStyle = 'rgba(20,14,34,0.9)';
        g.fill();
        g.lineWidth = 1.5;
        g.strokeStyle = col;
        g.stroke();
        UI.icon(g, def.icon, x + 8, 62, 11);
        const n = cards[id] || 0;
        if (n > 1) UI.text(g, '×' + n, x + 14, 52, { size: 9, weight: 'bold', color: '#fff', shadow: false, stroke: '#000', strokeW: 2 });
        x += 21;
      }
      if (cardOrder.length > shown.length) {
        UI.text(g, '+' + (cardOrder.length - shown.length), x + 4, 56, { size: 11, weight: 'bold', color: '#c9b6ff', shadow: false });
      }
    },
  };

  V.HUD = HUD;
})();

</script>
  <script>
/* js/scenes/title.js */
// Menu principal: nova jornada, continuar, Altar, som e créditos.
(() => {
  const V = (window.V = window.V || {});
  const { UI, Sprites, Audio, Util } = { UI: V.UI, Sprites: V.Sprites, Audio: V.Audio, Util: V.Util };

  const Title = {
    t: 0,
    buttons: [],

    enter() {
      this.t = 0;
      Audio.playTrack('title');
      this.build();
    },

    build() {
      const hasSave = V.Game.hasSavedRun();
      const items = [{ id: 'new', label: 'Nova Jornada', color: '#7a4fd6' }];
      if (hasSave) items.push({ id: 'continue', label: 'Continuar', color: '#2f9e8a' });
      items.push({ id: 'altar', label: 'Altar das Relíquias', color: '#b5673a' });
      items.push({ id: 'sound', label: this.soundLabel(), color: '#4a6fb8' });
      items.push({ id: 'credits', label: 'Créditos', color: '#5b5470' });
      let y = 352;
      this.buttons = items.map((it) => {
        const b = { x: 60, y, w: 240, h: 46, label: it.label, color: it.color, id: it.id };
        y += 56;
        return b;
      });
    },

    soundLabel() {
      return 'Som: ' + (Audio.enabled ? 'Ligado' : 'Desligado');
    },

    update(dt) {
      this.t += dt;
    },

    draw(g) {
      const t = this.t;
      UI.backdrop(g, 360, 640, '#1c1244', '#05030c');
      UI.stars(g, 360, 640, t, 70, 3);

      // Lua do eclipse
      const mx = 180;
      const my = 110;
      const glow = g.createRadialGradient(mx, my, 60, mx, my, 150);
      glow.addColorStop(0, 'rgba(255,207,90,0.35)');
      glow.addColorStop(1, 'rgba(255,207,90,0)');
      g.fillStyle = glow;
      g.fillRect(0, 0, 360, 300);
      g.beginPath();
      g.arc(mx, my, 50, 0, Math.PI * 2);
      g.fillStyle = '#0a0614';
      g.fill();
      g.beginPath();
      g.arc(mx, my, 52, t * 0.5, t * 0.5 + Math.PI * 1.6);
      g.strokeStyle = '#ffcf5a';
      g.lineWidth = 3;
      g.stroke();

      // Títulos
      UI.title(g, 'VAELMOR', 180, 186, { align: 'center', size: 44, strokeW: 8 });
      UI.text(g, 'O Arqueiro do Eclipse', 180, 236, {
        align: 'center', size: 18, color: '#e6dcff', font: 'Georgia, serif', weight: 'italic',
      });

      // Arqueira
      const bob = Math.sin(t * 2.2) * 4;
      Sprites.draw(g, 'player', 180, 300 + bob, 66, { frame: Math.floor(t * 2) % 2 });
      // Botões
      for (const b of this.buttons) {
        const label = b.id === 'sound' ? this.soundLabel() : b.label;
        UI.button(g, { ...b, label });
      }

      // Rodapé
      const best = V.Meta.best;
      UI.text(g, `Relíquias: ${V.Meta.relics}`, 180, 606, { align: 'center', size: 15, weight: 'bold', color: '#c9a0ff' });
      if (best.runs > 0) {
        UI.text(g, `Recorde: capítulo ${best.chapter} · ${best.kills} inimigos`, 180, 626, {
          align: 'center', size: 12, color: '#b7aed0',
        });
      }
    },

    onPointer(type, x, y) {
      if (type !== 'down') return;
      for (const b of this.buttons) {
        if (!UI.hit(b, x, y)) continue;
        Audio.sfx('click');
        this.act(b.id);
        return;
      }
    },

    act(id) {
      if (id === 'new') {
        V.Run.start();
        V.Game.clearRun();
        V.Meta.best.runs = (V.Meta.best.runs || 0) + 1;
        V.Meta.save();
        const ch = V.Data.chapters[0];
        V.Game.go('story', {
          title: 'Prólogo',
          lines: V.Data.story.prologue.concat([{ who: null, text: '— ' + ch.name + ' —' }], ch.intro),
          next: { name: 'map' },
        });
      } else if (id === 'continue') {
        const saved = V.Util.store.get('run', null);
        if (V.Run.restore(saved)) V.Game.go('map', {});
      } else if (id === 'altar') {
        V.Game.go('altar', {});
      } else if (id === 'sound') {
        Audio.setEnabled(!Audio.enabled);
        this.build();
      } else if (id === 'credits') {
        V.Game.go('credits', {});
      }
    },

    onKey(code, down) {
      if (!down) return;
      if (code === 'Enter' || code === 'Space') this.act('new');
    },
  };

  V.Scenes = V.Scenes || {};
  V.Scenes.title = Title;
})();

/* js/scenes/story.js */
// Cena de história: retratos, falas com efeito de digitação e narração.
(() => {
  const V = (window.V = window.V || {});
  const { UI, Sprites, Audio } = V;

  const CPS = 42; // caracteres por segundo

  const Story = {
    data: null,
    i: 0,
    shown: 0,
    lineCache: null,
    t: 0,
    blink: 0,

    enter(data) {
      this.data = data;
      this.i = 0;
      this.t = 0;
      this.blink = 0;
      this.prepare();
      Audio.playTrack(this.trackFor(data));
    },

    trackFor(data) {
      if (data.music) return data.music;
      return 'title';
    },

    line() {
      return this.data.lines[this.i];
    },

    prepare() {
      const line = this.line();
      this.total = line ? line.text.length : 0;
      this.shown = 0;
    },

    finishLine() {
      this.shown = this.total;
    },

    next() {
      if (this.shown < this.total) {
        this.finishLine();
        return;
      }
      this.i++;
      if (this.i >= this.data.lines.length) {
        this.done();
        return;
      }
      this.prepare();
    },

    done() {
      const n = this.data.next || { name: 'map' };
      V.Game.go(n.name, n.data || {});
    },

    update(dt) {
      this.t += dt;
      this.blink += dt;
      if (this.shown < this.total) {
        const before = Math.floor(this.shown);
        this.shown = Math.min(this.total, this.shown + CPS * dt);
        if (Math.floor(this.shown) !== before && Math.floor(this.shown) % 3 === 0) Audio.sfx('type');
      }
    },

    draw(g) {
      const line = this.line();
      if (!line) return;
      const t = this.t;
      UI.backdrop(g, 360, 640, '#1a1038', '#06040f');
      UI.stars(g, 360, 640, t, 40, 11);

      // Título do bloco (capítulo ou prólogo)
      UI.text(g, (this.data.title || '').toUpperCase(), 180, 28, {
        align: 'center', size: 13, weight: 'bold', color: '#c9b6ff', shadow: false,
      });
      // Progresso
      const n = this.data.lines.length;
      for (let k = 0; k < n; k++) {
        const x = 180 - ((n - 1) * 10) / 2 + k * 10;
        g.beginPath();
        g.arc(x, 48, 3, 0, Math.PI * 2);
        g.fillStyle = k <= this.i ? '#ffd77a' : 'rgba(255,255,255,0.2)';
        g.fill();
      }

      if (!line.who) {
        // Narração centralizada
        UI.panel(g, 22, 170, 316, 240, { fill: 'rgba(12,8,22,0.55)', stroke: 'rgba(201,182,255,0.35)' });
        const txt = line.text.slice(0, Math.floor(this.shown));
        UI.text(g, txt, 46, 200, {
          size: 19, color: '#eae3ff', maxW: 268, lineH: 28, font: 'Georgia, serif', shadow: false,
        });
      } else {
        const face = line.face || 'ysa';
        g.save();
        // Retrato com leve movimento
        const bob = Math.sin(t * 1.8) * 2;
        g.drawImage(Sprites.bust(face), 180 - 110, 70 + bob, 220, 220);
        g.restore();
        // Placa de nome
        UI.panel(g, 96, 286, 168, 34, { r: 10, fill: 'rgba(40,24,64,0.95)', stroke: '#ffd77a' });
        UI.text(g, line.who, 180, 295, { align: 'center', size: 17, weight: 'bold', color: '#ffe9b0', shadow: false });
        // Caixa de diálogo
        UI.panel(g, 18, 332, 324, 210, { fill: 'rgba(12,8,22,0.9)' });
        const txt = line.text.slice(0, Math.floor(this.shown));
        UI.text(g, txt, 36, 352, { size: 17, color: '#f4eefc', maxW: 288, lineH: 25, shadow: false });
      }

      // Pular e dica
      UI.button(g, { x: 268, y: 8, w: 80, h: 28, label: 'Pular', color: '#4a4558', size: 13 });
      if (Math.floor(this.blink * 2) % 2 === 0 && this.shown >= this.total) {
        UI.text(g, 'toque para continuar ▸', 180, 580, { align: 'center', size: 13, color: '#ffd77a', shadow: true });
      }
    },

    onPointer(type, x, y) {
      if (type !== 'down') return;
      if (UI.hit({ x: 268, y: 8, w: 80, h: 28 }, x, y)) {
        this.done();
        return;
      }
      this.next();
    },

    onKey(code, down) {
      if (!down) return;
      if (code === 'Enter' || code === 'Space' || code === 'KeyZ') this.next();
      if (code === 'Escape') this.done();
    },
  };

  V.Scenes = V.Scenes || {};
  V.Scenes.story = Story;
})();

</script>

// Mapa do capítulo: trilha de nós, posição da arqueira e duas escolhas por passo.
(() => {
  const V = (window.V = window.V || {});
  const { UI, Sprites, Audio, Run } = V;

  const TYPES = {
    combat: { name: 'Combate', icon: 'sword', color: '#4fbf6a', desc: 'Ondas de monstros. XP e ouro comuns.' },
    elite: { name: 'Campeão', icon: 'fire', color: '#e0573f', desc: 'Campeões fortes. Recompensa maior.' },
    treasure: { name: 'Tesouro', icon: 'gold', color: '#e0b84a', desc: 'Escolha 1 de 3 cartas sem custo.' },
    rest: { name: 'Descanso', icon: 'heart', color: '#5fd3a0', desc: 'Recupera 35% da vida atual.' },
    shop: { name: 'Mercador', icon: 'relic', color: '#9a7bff', desc: 'Compre poções e cartas com ouro.' },
    boss: { name: 'Chefe', icon: 'moon', color: '#ffb347', desc: 'Enfrente o guardião do capítulo.' },
  };

  // Posições dos nós (passo 0 embaixo, chefe em cima).
  const NODE_POS = [
    { x: 180, y: 452 },
    { x: 252, y: 416 },
    { x: 118, y: 380 },
    { x: 246, y: 344 },
    { x: 116, y: 308 },
    { x: 240, y: 272 },
    { x: 150, y: 236 },
    { x: 180, y: 200 },
  ];

  const Map = {
    t: 0,
    banner: null,
    bannerT: 0,
    cards: [],
    menuBtn: { x: 262, y: 66, w: 84, h: 26 },

    enter(data) {
      this.t = 0;
      this.banner = data.banner || null;
      this.bannerT = 2.0;
      if (!Run.active) {
        V.Game.go('title');
        return;
      }
      const ch = Run.chapterDef();
      Audio.playTrack(ch.music);
      Run.currentChoices();
      V.Game.saveRun();
    },

    update(dt) {
      this.t += dt;
      if (this.bannerT > 0) this.bannerT -= dt;
    },

    layoutCards(choices) {
      if (choices.length === 1) return [{ x: 60, y: 486, w: 240, h: 130, type: choices[0] }];
      return choices.map((type, i) => ({ x: 14 + i * 172, y: 486, w: 166, h: 130, type }));
    },

    draw(g) {
      const ch = Run.chapterDef();
      const choices = Run.currentChoices();
      const [c0, c1] = ch.bg;
      UI.backdrop(g, 360, 640, c0, c1);
      UI.stars(g, 360, 640, this.t, 50, 23);

      // Cabeçalho
      UI.text(g, `CAPÍTULO ${ch.id} de ${V.Data.chapters.length}`, 18, 108, {
        size: 12, weight: 'bold', color: '#c9b6ff', shadow: false,
      });
      UI.title(g, ch.name, 18, 124, { size: 21, strokeW: 5 });
      UI.text(g, ch.subtitle, 18, 150, { size: 12, color: '#b7aed0', font: 'Georgia, serif' });

      // Trilha
      g.save();
      g.setLineDash([4, 6]);
      g.strokeStyle = 'rgba(255,215,122,0.35)';
      g.lineWidth = 3;
      g.beginPath();
      NODE_POS.forEach((p, i) => (i ? g.lineTo(p.x, p.y) : g.moveTo(p.x, p.y)));
      g.stroke();
      g.restore();

      const step = Run.step;
      const boss = Run.isBossNode();
      for (let i = 0; i < NODE_POS.length; i++) {
        const p = NODE_POS[i];
        const isBoss = i === 7;
        const done = i < step;
        const current = i === step;
        const r = isBoss ? 22 : 17;
        g.beginPath();
        g.arc(p.x, p.y, r, 0, Math.PI * 2);
        if (done) {
          g.fillStyle = '#2f8f5a';
        } else if (current) {
          g.fillStyle = isBoss ? '#ffb347' : '#ffd77a';
        } else {
          g.fillStyle = 'rgba(20,14,34,0.85)';
        }
        g.fill();
        g.lineWidth = current ? 3 : 2;
        g.strokeStyle = current ? '#fff3c4' : done ? '#9ff0c0' : 'rgba(255,255,255,0.25)';
        g.stroke();
        if (current) {
          const pulse = 1 + Math.sin(this.t * 5) * 0.12;
          g.beginPath();
          g.arc(p.x, p.y, (r + 7) * pulse, 0, Math.PI * 2);
          g.strokeStyle = 'rgba(255,215,122,0.5)';
          g.lineWidth = 2;
          g.stroke();
        }
        if (done) {
          g.beginPath();
          g.moveTo(p.x - 7, p.y);
          g.lineTo(p.x - 2, p.y + 5);
          g.lineTo(p.x + 7, p.y - 5);
          g.strokeStyle = '#fff';
          g.lineWidth = 3;
          g.stroke();
        } else if (isBoss) {
          UI.icon(g, 'moon', p.x, p.y, 22);
        } else if (current) {
          UI.text(g, '?', p.x, p.y - 12, { align: 'center', size: 20, weight: 'bold', color: '#2a1408', shadow: false });
        }
      }
      // Marcador da arqueira no passo atual
      const cur = NODE_POS[Math.min(step, 7)];
      Sprites.draw(g, 'player', cur.x + 26, cur.y - 22 + Math.sin(this.t * 3) * 2, 34, { frame: Math.floor(this.t * 2) % 2 });

      // Escolhas
      const cards = this.layoutCards(boss ? ['boss'] : choices);
      this.cards = cards;
      for (const c of cards) {
        const info = TYPES[c.type];
        UI.panel(g, c.x, c.y, c.w, c.h, { fill: 'rgba(14,9,26,0.92)', stroke: info.color, lw: 2.5, r: 16 });
        UI.icon(g, info.icon, c.x + 30, c.y + 30, 30);
        UI.text(g, info.name, c.x + 54, c.y + 18, { size: 17, weight: 'bold', color: info.color, shadow: false });
        UI.text(g, info.desc, c.x + 12, c.y + 56, { size: 12, maxW: c.w - 24, lineH: 15, color: '#e8e2f5', shadow: false });
        if (c.type === 'treasure' || c.type === 'shop' || c.type === 'rest') {
          UI.text(g, 'Evento', c.x + c.w - 12, c.y + c.h - 20, { size: 11, align: 'right', color: '#b7aed0', shadow: false });
        } else if (c.type === 'boss') {
          UI.text(g, 'Toque para enfrentar', c.x + c.w / 2, c.y + c.h - 24, { size: 13, align: 'center', weight: 'bold', color: '#ffd77a', shadow: false });
        } else {
          UI.text(g, 'Combate', c.x + c.w - 12, c.y + c.h - 20, { size: 11, align: 'right', color: '#b7aed0', shadow: false });
        }
      }

      // Cabeçalho: HUD e menu
      V.HUD.draw(g, Run.stats, Run.level, Run.xp, Run.xpNeeded(Run.level), Run.gold, Run.cardOrder, Run.cards);
      UI.button(g, { ...this.menuBtn, label: 'Menu', color: '#4a4558', size: 13 });

      // Faixa de aviso
      if (this.banner && this.bannerT > 0) {
        const a = Math.min(1, this.bannerT);
        g.globalAlpha = a;
        UI.panel(g, 40, 300, 280, 52, { fill: 'rgba(10,6,20,0.88)', stroke: '#ffd77a', r: 14 });
        UI.text(g, this.banner, 180, 316, { align: 'center', size: 20, weight: 'bold', color: '#ffe9b0', shadow: false });
        g.globalAlpha = 1;
      }
    },

    onPointer(type, x, y) {
      if (type !== 'down') return;
      if (UI.hit(this.menuBtn, x, y)) {
        V.Game.saveRun();
        V.Game.go('title');
        return;
      }
      for (const c of this.cards) {
        if (!UI.hit(c, x, y)) continue;
        Audio.sfx('select');
        this.choose(c.type);
        return;
      }
    },

    choose(type) {
      const ch = Run.chapterDef();
      if (type === 'boss') {
        V.Game.go('story', {
          title: ch.name + ' · Chefe',
          music: 'boss',
          lines: V.Data.story.chapters[Run.chapter].bossIntro,
          next: { name: 'gameplay', data: { kind: 'boss' } },
        });
        return;
      }
      if (type === 'combat' || type === 'elite') {
        V.Game.go('gameplay', { kind: type });
        return;
      }
      V.Game.go('event', { type });
    },

    onKey(code, down) {
      if (!down) return;
      if (code === 'Escape') {
        V.Game.saveRun();
        V.Game.go('title');
      }
      if (code === 'Digit1' || code === 'KeyA') this.choose(this.cards[0] && this.cards[0].type);
      if ((code === 'Digit2' || code === 'KeyD') && this.cards[1]) this.choose(this.cards[1].type);
    },
  };

  V.Scenes = V.Scenes || {};
  V.Scenes.map = Map;
  V.Scenes.mapTypes = TYPES;
})();
