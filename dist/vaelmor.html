/* Página: o jogo ocupa a janela inteira; o canvas é escalado mantendo a proporção 360×640. */
:root {
  color-scheme: dark;
  --bg: #07050c;
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: var(--bg);
  overscroll-behavior: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;

body {

  position: fixed;
  left: 0;
  top: 0;
  display: block;

  cursor: pointer;

  <script>
/* js/core/util.js */
// Utilitários gerais: matemática, RNG semeado, armazenamento seguro e texto.
(() => {
  const V = (window.V = window.V || {});

  const TAU = Math.PI * 2;
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const lerp = (a, b, t) => a + (b - a) * t;
  const approach = (v, target, step) => (v < target ? Math.min(v + step, target) : Math.max(v - step, target));
  const dist2 = (ax, ay, bx, by) => {
    const dx = ax - bx;
    const dy = ay - by;
    return dx * dx + dy * dy;
  };
  const dist = (ax, ay, bx, by) => Math.sqrt(dist2(ax, ay, bx, by));
  const angleTo = (ax, ay, bx, by) => Math.atan2(by - ay, bx - ax);
  const easeOutCubic = (t) => 1 - Math.pow(1 - clamp(t, 0, 1), 3);
  const easeInOut = (t) => {
    t = clamp(t, 0, 1);
    return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  };
  const smoothstep = (t) => {
    t = clamp(t, 0, 1);
    return t * t * (3 - 2 * t);
  };

  // Gerador pseudoaleatório semeado (mulberry32): mesma semente, mesma sequência.
  function makeRng(seed) {
    let s = seed >>> 0;
    const next = () => {
      s = (s + 0x6d2b79f5) >>> 0;
      let t = s;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
    return {
      next,
      range: (a, b) => a + (b - a) * next(),
      int: (a, b) => Math.floor(a + (b - a + 1) * next()), // inclusivo
      chance: (p) => next() < p,
      pick: (arr) => arr[Math.floor(next() * arr.length)],
      weighted(items) {
        let total = 0;
        for (const it of items) total += it.w;
        let r = next() * total;
        for (const it of items) {
          r -= it.w;
          if (r <= 0) return it;
        }
        return items[items.length - 1];
      },
      shuffle(arr) {
        const a = arr.slice();
        for (let i = a.length - 1; i > 0; i--) {
          const j = Math.floor(next() * (i + 1));
          [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
      },
    };
  }

  // RNG do combate (não precisa ser reproduzível).
  const R = makeRng((Math.random() * 0xffffffff) >>> 0);

  // Armazenamento seguro: nunca quebra o jogo se localStorage estiver bloqueado.
  const store = {
    get(key, fallback) {
      try {
        const raw = window.localStorage.getItem('vaelmor:' + key);
        return raw == null ? fallback : JSON.parse(raw);
      } catch (e) {
        return fallback;
      }
    },
    set(key, value) {
      try {
        window.localStorage.setItem('vaelmor:' + key, JSON.stringify(value));
      } catch (e) {
        /* modo privado ou armazenamento cheio: ignora */
      }
    },
  };

  // Quebra um texto em linhas que caibam em maxW pixels com a fonte atual do contexto.
  function wrapText(g, text, maxW) {
    const out = [];
    for (const para of String(text).split('\n')) {
      const words = para.split(' ');
      let line = '';
      for (const w of words) {
        const test = line ? line + ' ' + w : w;
        if (g.measureText(test).width <= maxW || !line) {
          line = test;
        } else {
          out.push(line);
          line = w;
        }
      }
      out.push(line);
    }
    return out;
  }

  const FONT = "'Trebuchet MS', 'Segoe UI', system-ui, -apple-system, sans-serif";
  const FONT_TITLE = "Georgia, 'Times New Roman', serif";

  V.Util = {
    TAU,
    clamp,
    lerp,
    approach,
    dist,
    dist2,
    angleTo,
    easeOutCubic,
    easeInOut,
    smoothstep,
    makeRng,
    R,
    store,
    wrapText,
    FONT,
    FONT_TITLE,
  };
})();

</script>
  <script>
/* js/core/input.js */
// Entrada: teclado (WASD/setas) e ponteiro/touch com joystick virtual arrastável.
(() => {
  const V = (window.V = window.V || {});

  const MOVE_KEYS = {
    ArrowUp: 'up', KeyW: 'up',
    ArrowDown: 'down', KeyS: 'down',
    ArrowLeft: 'left', KeyA: 'left',
    ArrowRight: 'right', KeyD: 'right',
  };

  const held = new Set();
  const stick = { active: false, ox: 0, oy: 0, x: 0, y: 0, id: null };
  let toLogical = (cx, cy) => ({ x: cx, y: cy });
  let onKeyCb = null;
  let onPointerCb = null;
  const pressedThisFrame = new Set();

  function keyVector() {
    let x = 0;
    let y = 0;
    if (held.has('left')) x -= 1;
    if (held.has('right')) x += 1;
    if (held.has('up')) y -= 1;
    if (held.has('down')) y += 1;
    const len = Math.hypot(x, y);
    if (len > 1) {
      x /= len;
      y /= len;
    }
    return { x, y };
  }

  const Input = {
    init(canvas, mapFn, keyCb, pointerCb) {
      toLogical = mapFn;
      onKeyCb = keyCb;
      onPointerCb = pointerCb;

      window.addEventListener('keydown', (e) => {
        if (e.target && e.target.tagName === 'INPUT') return;
        const dir = MOVE_KEYS[e.code];
        if (dir) {
          held.add(dir);
          e.preventDefault();
        }
        if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
        if (!e.repeat) pressedThisFrame.add(e.code);
        if (onKeyCb) onKeyCb(e.code, true, e);
      });
      window.addEventListener('keyup', (e) => {
        const dir = MOVE_KEYS[e.code];
        if (dir) held.delete(dir);
        if (onKeyCb) onKeyCb(e.code, false, e);
      });
      window.addEventListener('blur', () => {
        held.clear();
        stick.active = false;
        stick.x = 0;
        stick.y = 0;
      });

      const down = (e) => {
        const p = toLogical(e.clientX, e.clientY);
        if (stick.id !== null && e.pointerId !== stick.id) return;
        stick.active = true;
        stick.id = e.pointerId;
        stick.ox = p.x;
        stick.oy = p.y;
        stick.x = 0;
        stick.y = 0;
        if (onPointerCb) onPointerCb('down', p.x, p.y);
        e.preventDefault();
      };
      const move = (e) => {
        const p = toLogical(e.clientX, e.clientY);
        if (stick.active && e.pointerId === stick.id) {
          const dx = p.x - stick.ox;
          const dy = p.y - stick.oy;
          const len = Math.hypot(dx, dy);
          const full = 46; // distância (lógica) para velocidade máxima
          const k = len > 0 ? Math.min(len, full) / full : 0;
          stick.x = len > 0 ? (dx / len) * k : 0;
          stick.y = len > 0 ? (dy / len) * k : 0;
        }
        if (onPointerCb) onPointerCb('move', p.x, p.y);
      };
      const up = (e) => {
        const p = toLogical(e.clientX, e.clientY);
        if (e.pointerId === stick.id) {
          stick.active = false;
          stick.id = null;
          stick.x = 0;
          stick.y = 0;
        }
        if (onPointerCb) onPointerCb('up', p.x, p.y);
      };

      canvas.addEventListener('pointerdown', down);
      canvas.addEventListener('pointermove', move);
      canvas.addEventListener('pointerup', up);
      canvas.addEventListener('pointercancel', up);
      canvas.addEventListener('contextmenu', (e) => e.preventDefault());
      canvas.style.touchAction = 'none';
    },

    // Vetor de movimento combinando teclado e joystick, com módulo até 1.
    move() {
      const k = keyVector();
      if (stick.active && (stick.x || stick.y)) {
        return {
          x: clamp1(k.x + stick.x),
          y: clamp1(k.y + stick.y),
        };
      }
      return k;
    },

    stick,

    isHeld(dir) {
      return held.has(dir);
    },

    // Teclas pressionadas desde o último clearFrame(); usado para ações de um toque.
    wasPressed(code) {
      return pressedThisFrame.has(code);
    },

    clearFrame() {
      pressedThisFrame.clear();
    },

    reset() {
      held.clear();
      stick.active = false;
      stick.id = null;
      stick.x = 0;
      stick.y = 0;
    },
  };

  function clamp1(v) {
    return v > 1 ? 1 : v < -1 ? -1 : v;
  }

  V.Input = Input;
})();

</script>
  <script>
/* js/core/audio.js */
// Áudio procedural: efeitos e músicas sintetizados com Web Audio (sem arquivos externos).
(() => {
  const V = (window.V = window.V || {});
  const { makeRng } = V.Util;

  const midiHz = (m) => 440 * Math.pow(2, (m - 69) / 12);

  // Escalas (intervalos em semitons).
  const SCALES = {
    dorian: [0, 2, 3, 5, 7, 9, 10],
    minor: [0, 2, 3, 5, 7, 8, 10],
    phrygian: [0, 1, 3, 5, 7, 8, 10],
    major: [0, 2, 4, 5, 7, 9, 11],
    pent: [0, 3, 5, 7, 10],
  };

  // Faixas de música: a melodia é gerada a partir da semente, então cada faixa tem identidade própria.
  const TRACKS = {
    title: { root: 50, scale: 'dorian', bpm: 84, seed: 11, wave: 'triangle', density: 0.55 },
    forest: { root: 50, scale: 'pent', bpm: 98, seed: 23, wave: 'triangle', density: 0.6 },
    mines: { root: 43, scale: 'phrygian', bpm: 86, seed: 37, wave: 'sawtooth', density: 0.45 },
    tower: { root: 45, scale: 'minor', bpm: 112, seed: 53, wave: 'square', density: 0.7 },
    shop: { root: 55, scale: 'major', bpm: 100, seed: 71, wave: 'triangle', density: 0.5 },
    boss: { root: 41, scale: 'phrygian', bpm: 128, seed: 89, wave: 'sawtooth', density: 0.85 },
  };

  const Audio = {
    ctx: null,
    master: null,
    sfxBus: null,
    musicBus: null,
    enabled: true,
    track: null,
    _timer: null,
    _nextTime: 0,
    _step: 0,
    _pattern: null,
    _trackName: null,

    init() {
      if (this.ctx) return;
      try {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        this.ctx = new AC();
        this.master = this.ctx.createGain();
        this.master.gain.value = 0.7;
        this.master.connect(this.ctx.destination);
        this.sfxBus = this.ctx.createGain();
        this.sfxBus.gain.value = 0.55;
        this.sfxBus.connect(this.master);
        this.musicBus = this.ctx.createGain();
        this.musicBus.gain.value = 0.22;
        this.musicBus.connect(this.master);
      } catch (e) {
        this.ctx = null;
      }
    },

    // Chamado a partir de um gesto do usuário (navegadores exigem isso).
    unlock() {
      this.init();
      if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
      if (this.enabled && this._trackName && !this._timer) this.playTrack(this._trackName);
    },

    setEnabled(on) {
      this.enabled = on;
      V.Util.store.set('sound', on);
      if (!this.musicBus) return;
      this.musicBus.gain.value = on ? 0.22 : 0;
      this.sfxBus.gain.value = on ? 0.55 : 0;
      if (on) this.unlock();
    },

    _tone(freq, dur, o = {}) {
      if (!this.ctx || !this.enabled) return;
      const t0 = this.ctx.currentTime + (o.delay || 0);
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = o.type || 'square';
      osc.frequency.setValueAtTime(freq, t0);
      if (o.slideTo) osc.frequency.exponentialRampToValueAtTime(Math.max(20, o.slideTo), t0 + dur);
      const vol = o.vol == null ? 0.2 : o.vol;
      const att = o.attack == null ? 0.004 : o.attack;
      gain.gain.setValueAtTime(0.0001, t0);
      gain.gain.exponentialRampToValueAtTime(vol, t0 + att);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      osc.connect(gain);
      gain.connect(o.bus || this.sfxBus);
      osc.start(t0);
      osc.stop(t0 + dur + 0.02);
    },

    _noise(dur, o = {}) {
      if (!this.ctx || !this.enabled) return;
      const t0 = this.ctx.currentTime + (o.delay || 0);
      const len = Math.floor(this.ctx.sampleRate * dur);
      const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      const data = buf.getChannelData(0);
      for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / len);
      const src = this.ctx.createBufferSource();
      src.buffer = buf;
      const filter = this.ctx.createBiquadFilter();
      filter.type = o.filter || 'lowpass';
      filter.frequency.value = o.freq || 1200;
      const gain = this.ctx.createGain();
      gain.gain.value = o.vol == null ? 0.3 : o.vol;
      src.connect(filter);
      filter.connect(gain);
      gain.connect(this.sfxBus);
      src.start(t0);
    },

    sfx(name) {
      if (!this.ctx || !this.enabled) return;
      const T = this._tone.bind(this);
      const N = this._noise.bind(this);
      switch (name) {
        case 'shoot':
          T(880, 0.08, { type: 'square', vol: 0.07, slideTo: 440 });
          break;
        case 'enemyShoot':
          T(260, 0.12, { type: 'sawtooth', vol: 0.06, slideTo: 180 });
          break;
        case 'hit':
          T(520, 0.05, { type: 'triangle', vol: 0.12, slideTo: 300 });
          break;
        case 'crit':
          T(990, 0.09, { type: 'square', vol: 0.1, slideTo: 1400 });
          break;
        case 'hurt':
          T(180, 0.22, { type: 'sawtooth', vol: 0.18, slideTo: 60 });
          N(0.12, { vol: 0.15, freq: 900 });
          break;
        case 'die':
          T(300, 0.5, { type: 'triangle', vol: 0.2, slideTo: 40 });
          N(0.35, { vol: 0.25, freq: 500 });
          break;
        case 'enemyDie':
          T(400, 0.18, { type: 'triangle', vol: 0.12, slideTo: 90 });
          N(0.1, { vol: 0.12, freq: 1600 });
          break;
        case 'coin':
          T(988, 0.07, { type: 'square', vol: 0.08 });
          T(1319, 0.12, { type: 'square', vol: 0.08, delay: 0.06 });
          break;
        case 'gem':
          [660, 880, 1320].forEach((f, i) => T(f, 0.12, { type: 'triangle', vol: 0.12, delay: i * 0.05 }));
          break;
        case 'heal':
          [523, 659, 784, 1046].forEach((f, i) => T(f, 0.18, { type: 'sine', vol: 0.14, delay: i * 0.07 }));
          break;
        case 'xp':
          T(1200, 0.05, { type: 'sine', vol: 0.05 });
          break;
        case 'levelup':
          [392, 523, 659, 784, 1046].forEach((f, i) => T(f, 0.2, { type: 'square', vol: 0.09, delay: i * 0.09 }));
          break;
        case 'click':
          T(640, 0.05, { type: 'triangle', vol: 0.12, slideTo: 520 });
          break;
        case 'select':
          T(520, 0.09, { type: 'triangle', vol: 0.14 });
          T(780, 0.12, { type: 'triangle', vol: 0.12, delay: 0.07 });
          break;
        case 'buy':
          T(740, 0.08, { type: 'square', vol: 0.09 });
          T(1110, 0.14, { type: 'square', vol: 0.09, delay: 0.07 });
          break;
        case 'deny':
          T(160, 0.18, { type: 'square', vol: 0.12, slideTo: 110 });
          break;
        case 'telegraph':
          T(220, 0.35, { type: 'sine', vol: 0.1, slideTo: 440 });
          break;
        case 'slam':
          T(90, 0.5, { type: 'sine', vol: 0.35, slideTo: 35 });
          N(0.4, { vol: 0.35, freq: 400 });
          break;
        case 'roar':
          T(110, 0.9, { type: 'sawtooth', vol: 0.22, slideTo: 55 });
          N(0.8, { vol: 0.18, freq: 300 });
          break;
        case 'blink':
          T(1400, 0.15, { type: 'sine', vol: 0.08, slideTo: 300 });
          break;
        case 'web':
          N(0.2, { vol: 0.12, freq: 3000, filter: 'highpass' });
          break;
        case 'portal':
          T(300, 0.6, { type: 'sine', vol: 0.12, slideTo: 900 });
          break;
        case 'roomClear':
          [523, 659, 784].forEach((f, i) => T(f, 0.16, { type: 'triangle', vol: 0.12, delay: i * 0.08 }));
          break;
        case 'victory':
          [523, 659, 784, 1046, 784, 1046, 1318].forEach((f, i) =>
            T(f, 0.25, { type: 'square', vol: 0.1, delay: i * 0.13 })
          );
          break;
        case 'defeat':
          [392, 370, 349, 330].forEach((f, i) => T(f, 0.35, { type: 'triangle', vol: 0.14, delay: i * 0.22 }));
          break;
        case 'type':
          T(900 + Math.random() * 200, 0.03, { type: 'square', vol: 0.03 });
          break;
        default:
          break;
      }
    },

    playTrack(name) {
      this._trackName = name;
      if (!this.ctx || !this.enabled) return;
      if (this.track === name && this._timer) return;
      this.stopMusic();
      const def = TRACKS[name];
      if (!def) return;
      this.track = name;
      this._pattern = buildPattern(def);
      this._step = 0;
      this._nextTime = this.ctx.currentTime + 0.1;
      this._timer = setInterval(() => this._schedule(), 40);
    },

    stopMusic() {
      if (this._timer) clearInterval(this._timer);
      this._timer = null;
      this.track = null;
    },

    _schedule() {
      if (!this.ctx || !this.enabled || !this._pattern) return;
      const p = this._pattern;
      const stepDur = 60 / p.bpm / 2; // colcheias
      while (this._nextTime < this.ctx.currentTime + 0.25) {
        const i = this._step % p.length;
        const t = this._nextTime;
        const mel = p.melody[i];
        if (mel) this._musicNote(midiHz(mel.m), stepDur * mel.len, t, p.wave, 0.09);
        if (i % 4 === 0) {
          const b = p.bass[(i / 4) % p.bass.length];
          this._musicNote(midiHz(b), stepDur * 3.6, t, 'triangle', 0.16);
        }
        if (i % 8 === 0 && p.pad) {
          const chord = p.pad[(i / 8) % p.pad.length];
          for (const m of chord) this._musicNote(midiHz(m), stepDur * 7.2, t, 'sine', 0.03);
        }
        this._nextTime += stepDur;
        this._step++;
      }
    },

    _musicNote(freq, dur, t, wave, vol) {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = wave;
      osc.frequency.setValueAtTime(freq, t);
      gain.gain.setValueAtTime(0.0001, t);
      gain.gain.exponentialRampToValueAtTime(vol, t + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      osc.connect(gain);
      gain.connect(this.musicBus);
      osc.start(t);
      osc.stop(t + dur + 0.05);
    },
  };

  // Gera um padrão de 32 colcheias (melodia com passos suaves), baixo e acordes.
  function buildPattern(def) {
    const rng = makeRng(def.seed);
    const scale = SCALES[def.scale];
    const rootMidi = def.root;
    const degreeToMidi = (d) => {
      const oct = Math.floor(d / scale.length);
      const idx = ((d % scale.length) + scale.length) % scale.length;
      return rootMidi + 12 + oct * 12 + scale[idx];
    };
    const length = 32;
    const melody = [];
    let deg = 0;
    for (let i = 0; i < length; i++) {
      if (rng.next() < def.density) {
        deg += rng.pick([-2, -1, -1, 0, 1, 1, 2, 3, -3]);
        deg = Math.max(-2, Math.min(scale.length + 2, deg));
        melody.push({ m: degreeToMidi(deg), len: rng.chance(0.3) ? 2 : 1 });
        if (rng.chance(0.25)) i++; // respiração entre notas
      } else {
        melody.push(null);
      }
    }
    const bass = [
      rootMidi - 12,
      rootMidi - 12 + 7,
      rootMidi - 12 + 5,
      rootMidi - 12 + 7,
    ];
    const pad = [
      [rootMidi, rootMidi + 3, rootMidi + 7],
      [rootMidi - 2, rootMidi + 2, rootMidi + 5],
      [rootMidi - 4, rootMidi, rootMidi + 3],
      [rootMidi - 2, rootMidi + 2, rootMidi + 7],
    ];
    return { bpm: def.bpm, wave: def.wave, length, melody: fitMelody(melody, length), bass, pad };
  }

  function fitMelody(melody, length) {
    const out = new Array(length).fill(null);
    for (let i = 0; i < melody.length && i < length; i++) out[i] = melody[i];
    return out;
  }

  Audio.TRACKS = TRACKS;
  V.Audio = Audio;
})();

  <script>
/* js/core/sprites.js */
// Sprites procedurais originais: personagens, monstros, chefes, projéteis, coletáveis,
// retratos, pisos e obstáculos. Tudo é desenhado por código e guardado em cache.
(() => {
  const V = (window.V = window.V || {});
  const TAU = Math.PI * 2;
  const INK = '#1a0f1f';

  // Paletas de cenário (usadas por pisos e obstáculos).
  const THEMES = {
    forest: { a: '#3d7b3a', b: '#468a43', dots: '#2f6130', wall: '#4f3b26', wallTop: '#7d6240', accent: '#9be36f', glow: '#c7ff8a' },
    mines: { a: '#4a4552', b: '#524c5a', dots: '#34303b', wall: '#2b2630', wallTop: '#564e60', accent: '#ff8a3d', glow: '#ffb347' },
    tower: { a: '#2a3050', b: '#303759', dots: '#1d2238', wall: '#1a1830', wallTop: '#3d3766', accent: '#b48cff', glow: '#e0c6ff' },
  };

  const cache = new Map();

  function makeCanvas(w, h) {
    const c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(w));
    c.height = Math.max(1, Math.round(h));
    return c;
  }

  // Cria um sprite com "unidades" de desenho escaladas para "px" pixels reais.
  function sprite(units, px, fn) {
    const c = makeCanvas(px, px);
    const g = c.getContext('2d');
    g.scale(px / units, px / units);
    fn(g);
    return c;
  }

  // Preenche (opcional) e contorna um caminho.
  function P(g, fill, path, lw = 2, stroke = INK) {
    g.beginPath();
    path(g);
    if (fill) {
      g.fillStyle = fill;
      g.fill();
    }
    if (lw > 0) {
      g.lineWidth = lw;
      g.strokeStyle = stroke;
      g.lineJoin = 'round';
      g.stroke();
    }
  }

  function dot(g, x, y, r, fill) {
    g.beginPath();
    g.arc(x, y, r, 0, TAU);
    g.fillStyle = fill;
    g.fill();
  }

  function line(g, pts, color, lw, cap = 'round') {
    g.beginPath();
    g.moveTo(pts[0][0], pts[0][1]);
    for (let i = 1; i < pts.length; i++) g.lineTo(pts[i][0], pts[i][1]);
    g.strokeStyle = color;
    g.lineWidth = lw;
    g.lineCap = cap;
    g.lineJoin = 'round';
    g.stroke();
  }

  function shadow(g, x, y, rx, ry) {
    g.beginPath();
    g.ellipse(x, y, rx, ry, 0, 0, TAU);
    g.fillStyle = 'rgba(0,0,0,0.26)';
    g.fill();
  }

  function radial(g, x, y, r0, r1, stops) {
    const grad = g.createRadialGradient(x, y, r0, x, y, r1);
    for (const [o, c] of stops) grad.addColorStop(o, c);
    return grad;
  }

  // ---------- Personagens ----------

  function drawPlayer(g, f) {
    const bob = f ? -1 : 0;
    const legS = f ? 2 : -2;
    shadow(g, 32, 58, 15, 4.5);
    // aljava
    P(g, '#6b4226', (g) => g.rect(37, 21 + bob, 5, 20), 1.6);
    P(g, '#ff5b5b', (g) => {
      g.moveTo(38, 21 + bob);
      g.lineTo(39.5, 16 + bob);
      g.lineTo(41, 21 + bob);
    }, 1.2);
    // pernas e botas
    P(g, '#2b2233', (g) => g.ellipse(27 + legS * 0.5, 57, 3.6, 2.6, 0, 0, TAU), 1.4);
    P(g, '#2b2233', (g) => g.ellipse(37 - legS * 0.5, 57, 3.6, 2.6, 0, 0, TAU), 1.4);
    // manto
    P(g, '#2f8f86', (g) => {
      g.moveTo(22, 32 + bob);
      g.quadraticCurveTo(32, 27 + bob, 42, 32 + bob);
      g.lineTo(46, 55);
      g.quadraticCurveTo(32, 60, 18, 55);
      g.closePath();
    });
    g.globalAlpha = 0.35;
    P(g, '#c6fff7', (g) => {
      g.moveTo(26, 38 + bob);
      g.lineTo(23, 52);
      g.lineTo(27, 52);
      g.lineTo(29, 38 + bob);
      g.closePath();
    }, 0);
    g.globalAlpha = 1;
    // capuz
    P(g, '#24706b', (g) => g.arc(32, 24 + bob, 9.5, 0, TAU));
    P(g, '#1d5a56', (g) => g.ellipse(32, 22 + bob, 7, 6, 0, 0, TAU), 0);
    // rosto
    P(g, '#f3d1a7', (g) => g.ellipse(32, 26 + bob, 5.4, 4.4, 0, 0, TAU), 1.2);
    dot(g, 30, 26.5 + bob, 0.95, '#1b1020');
    dot(g, 34, 26.5 + bob, 0.95, '#1b1020');
    // lenço e emblema de lua
    P(g, '#d9463e', (g) => g.rect(26, 31 + bob, 12, 3.2), 1);
    dot(g, 32, 40 + bob, 3.2, '#ffd166');
    dot(g, 33.2, 39.2 + bob, 2.6, '#2f8f86');
    // arco
    g.beginPath();
    g.arc(38, 36 + bob, 13, -1.1, 1.1);
    g.strokeStyle = '#8b5a2b';
    g.lineWidth = 2.4;
    g.lineCap = 'round';
    g.stroke();
    line(g, [[43.8, 24.4 + bob], [43.8, 47.6 + bob]], '#eee3c8', 0.9);
    dot(g, 44.2, 36 + bob, 2.1, '#f3d1a7');
  }

  function drawSlime(g, f, c) {
    const rx = f ? 20 : 22;
    const ry = f ? 18 : 15;
    const cy = f ? 40 : 42;
    shadow(g, 32, 56, 20, 5);
    const grad = radial(g, 26, cy - 8, 2, 26, [
      [0, c.hi],
      [1, c.base],
    ]);
    P(g, grad, (g) => g.ellipse(32, cy, rx, ry, 0, 0, TAU), 2.2);
    g.fillStyle = 'rgba(255,255,255,0.55)';
    g.beginPath();
    g.ellipse(25, cy - 8, 4.5, 2.6, -0.5, 0, TAU);
    g.fill();
    for (const ex of [26, 38]) {
      dot(g, ex, cy + 1, 4.2, '#fff');
      dot(g, ex, cy + 2, 2, INK);
    }
  }

  function drawBat(g, f) {
    shadow(g, 32, 56, 12, 3.5);
    const tipY = f ? 16 : 34;
    const wing = (g) => {
      g.moveTo(32, 34);
      g.quadraticCurveTo(20, 18, 4, tipY);
      g.quadraticCurveTo(14, 34, 22, 44);
      g.quadraticCurveTo(27, 42, 32, 40);
      g.closePath();
    };
    P(g, '#4a3566', wing, 1.8);
    g.save();
    g.translate(64, 0);
    g.scale(-1, 1);
    P(g, '#4a3566', wing, 1.8);
    g.restore();
    P(g, '#3d2b52', (g) => g.ellipse(32, 36, 8, 9, 0, 0, TAU), 1.8);
    P(g, '#3d2b52', (g) => {
      g.moveTo(26, 30);
      g.lineTo(23, 20);
      g.lineTo(30, 27);
      g.closePath();
    }, 1.6);
    P(g, '#3d2b52', (g) => {
      g.moveTo(38, 30);
      g.lineTo(41, 20);
      g.lineTo(34, 27);
      g.closePath();
    }, 1.6);
    dot(g, 29, 34, 2, '#ff4d6d');
    dot(g, 35, 34, 2, '#ff4d6d');
    dot(g, 30, 40.5, 1, '#fff');
    dot(g, 34, 40.5, 1, '#fff');
  }

  function drawSkeleton(g, f) {
    const s = f ? 2 : -2;
    shadow(g, 32, 58, 12, 4);
    // bacia e pernas
    line(g, [[27, 44], [25 + s * 0.4, 58]], '#ece6d2', 3);
    line(g, [[37, 44], [39 - s * 0.4, 58]], '#ece6d2', 3);
    // costelas e coluna
    line(g, [[32, 28], [32, 46]], '#d8d0b8', 2.2);
    for (const y of [34, 38, 42]) line(g, [[25, y], [39, y]], '#d8d0b8', 1.8);
    // braços
    line(g, [[28, 30], [22, 40]], '#ece6d2', 2.4);
    line(g, [[36, 30], [40, 39]], '#ece6d2', 2.4);
    // arco
    g.beginPath();
    g.arc(14, 36, 14, -1.1, 1.1);
    g.strokeStyle = '#7a4b2a';
    g.lineWidth = 2.4;
    g.stroke();
    line(g, [[20.3, 24.4], [20.3, 47.6]], '#eee3c8', 0.8);
    // crânio
    P(g, '#ece6d2', (g) => g.arc(32, 22, 9, 0, TAU), 1.8);
    P(g, '#ece6d2', (g) => g.rect(27, 27, 10, 4.5), 1.4);
    dot(g, 28.5, 22, 2.7, INK);
    dot(g, 35.5, 22, 2.7, INK);
    dot(g, 28.5, 22, 1, '#ff5b5b');
    dot(g, 35.5, 22, 1, '#ff5b5b');
    P(g, INK, (g) => {
      g.moveTo(32, 24.5);
      g.lineTo(30.5, 27);
      g.lineTo(33.5, 27);
      g.closePath();
    }, 0);
    line(g, [[29, 30], [29, 31.5]], INK, 0.8);
    line(g, [[33, 30], [33, 31.5]], INK, 0.8);
  }

  function drawWolf(g, f) {
    shadow(g, 32, 56, 22, 4.5);
    // cauda
    line(g, [[14, 34], [4, 24], [10, 16]], '#6b7185', 4.5);
    // patas (diagonais alternadas)
    const a = f ? 3 : -3;
    const legs = [
      [22, a],
      [26, -a],
      [40, -a],
      [44, a],
    ];
    for (const [x, d] of legs) line(g, [[x, 43], [x + d, 56]], '#4c5163', 4.2);
    // corpo
    P(g, '#6b7185', (g) => g.ellipse(30, 38, 18, 10, 0, 0, TAU), 2);
    P(g, '#8b91a3', (g) => g.ellipse(30, 42, 13, 4.5, 0, 0, TAU), 0);
    // cabeça e focinho
    P(g, '#6b7185', (g) => {
      g.moveTo(45, 24);
      g.lineTo(44, 34);
      g.quadraticCurveTo(48, 39, 53, 37);
      g.lineTo(60, 32);
      g.quadraticCurveTo(58, 27, 54, 26);
      g.closePath();
    }, 1.8);
    P(g, '#6b7185', (g) => g.ellipse(48, 30, 9, 8, 0, 0, TAU), 1.8);
    P(g, '#6b7185', (g) => {
      g.moveTo(41, 25);
      g.lineTo(42, 17);
      g.lineTo(47, 23);
      g.closePath();
    }, 1.6);
    P(g, '#6b7185', (g) => {
      g.moveTo(49, 22);
      g.lineTo(53, 16);
      g.lineTo(54, 24);
      g.closePath();
    }, 1.6);
    dot(g, 50, 28, 1.9, '#ff3b3b');
    dot(g, 59.5, 32, 1.3, INK);
    dot(g, 47, 25, 0.7, '#ff3b3b');
  }

  function drawShaman(g, f) {
    const orbR = f ? 5.6 : 4.4;
    shadow(g, 32, 58, 14, 4.5);
    P(g, '#4e7d3a', (g) => {
      g.moveTo(21, 58);
      g.lineTo(24, 34);
      g.quadraticCurveTo(32, 28, 40, 34);
      g.lineTo(43, 58);
      g.closePath();
    }, 2);
    line(g, [[22, 52], [42, 52]], '#c9a227', 1.6);
    // staff
    line(g, [[46, 58], [48, 20]], '#7a5030', 2.4);
    // capuz e rosto
    P(g, '#6a3a8a', (g) => g.arc(32, 28, 9, 0, TAU), 2);
    P(g, '#8fcf6a', (g) => g.ellipse(32, 31, 6, 5.6, 0, 0, TAU), 1.4);
    P(g, '#8fcf6a', (g) => {
      g.moveTo(26, 30);
      g.lineTo(18, 26);
      g.lineTo(25, 34);
      g.closePath();
    }, 1.4);
    P(g, '#8fcf6a', (g) => {
      g.moveTo(38, 30);
      g.lineTo(46, 26);
      g.lineTo(39, 34);
      g.closePath();
    }, 1.4);
    dot(g, 29.5, 30.5, 1.6, '#ffe066');
    dot(g, 34.5, 30.5, 1.6, '#ffe066');
    line(g, [[29, 35.5], [35, 35.5]], INK, 1);
    dot(g, 46, 36, 2.4, '#8fcf6a');
    // orbe
    dot(g, 48, 15, orbR + 5, 'rgba(127,242,230,0.28)');
    P(g, radial(g, 47, 14, 1, orbR, [
      [0, '#f0fffd'],
      [1, '#2fb8a8'],
    ]), (g) => g.arc(48, 15, orbR, 0, TAU), 1.2);
  }

  function drawGolem(g, f) {
    const s = f ? 2 : -2;
    shadow(g, 32, 58, 24, 5.5);
    // braços
    P(g, '#4f4a57', (g) => g.rect(8, 26 + s, 10, 22), 2);
    P(g, '#4f4a57', (g) => g.rect(46, 26 - s, 10, 22), 2);
    // pés
    P(g, '#3a3540', (g) => g.rect(21, 50, 9, 9 - s * 0.5), 2);
    P(g, '#3a3540', (g) => g.rect(34, 50, 9, 9 + s * 0.5), 2);
    // corpo
    P(g, '#5a5560', (g) => g.rect(17, 22, 30, 30), 2.4);
    line(g, [[22, 40], [33, 48]], '#ff8a3d', 1.8);
    line(g, [[25, 26], [29, 33], [25, 40], [31, 48]], '#ff8a3d', 1.6);
    line(g, [[41, 28], [38, 35], [42, 44]], '#ff8a3d', 1.4);
    // cabeça
    P(g, '#4a4550', (g) => g.rect(25, 10, 14, 12), 2.2);
    dot(g, 29.5, 16, 1.7, '#ffb347');
    dot(g, 34.5, 16, 1.7, '#ffb347');
  }

  function drawSpider(g, f) {
    shadow(g, 32, 58, 16, 4);
    const legsFor = (side) => {
      for (let i = 0; i < 4; i++) {
        const th = -1.1 + i * 0.72 + (f ? 0.14 : -0.14);
        const kx = 32 + side * Math.cos(th) * 15;
        const ky = 40 + Math.sin(th) * 10;
        const fx = 32 + side * Math.cos(th + 0.45) * 27;
        const fy = 40 + Math.sin(th + 0.45) * 20 + 4;
        line(g, [[32 + side * 6, 38 + i * 0.5], [kx, ky], [fx, fy]], '#2c2238', 2.2);
      }
    };
    legsFor(-1);
    legsFor(1);
    P(g, '#2c2238', (g) => g.ellipse(32, 41, 10.5, 9, 0, 0, TAU), 2.2);
    P(g, '#b3203a', (g) => {
      g.moveTo(28, 36);
      g.lineTo(36, 36);
      g.lineTo(32, 41);
      g.closePath();
    }, 0);
    P(g, '#b3203a', (g) => {
      g.moveTo(32, 41);
      g.lineTo(28, 46);
      g.lineTo(36, 46);
      g.closePath();
    }, 0);
    P(g, '#3a2c4a', (g) => g.arc(32, 27, 6.8, 0, TAU), 1.8);
    dot(g, 28.6, 27.5, 1.7, '#ff3b5c');
    dot(g, 35.4, 27.5, 1.7, '#ff3b5c');
    dot(g, 30.6, 23.8, 1, '#ff3b5c');
    dot(g, 33.4, 23.8, 1, '#ff3b5c');
  }

  function drawWraith(g, f) {
    const w = f ? 2 : -2;
    shadow(g, 32, 58, 12, 3.5);
    const grad = radial(g, 32, 28, 4, 26, [
      [0, 'rgba(220,255,255,0.95)'],
      [0.6, 'rgba(127,214,255,0.85)'],
      [1, 'rgba(60,110,200,0.55)'],
    ]);
    P(g, grad, (g) => {
      g.moveTo(32, 9);
      g.bezierCurveTo(50, 9, 52, 30, 46, 40);
      g.quadraticCurveTo(51, 44, 45, 50 + w);
      g.quadraticCurveTo(42, 57, 38, 50);
      g.quadraticCurveTo(34, 58, 30, 50 - w);
      g.quadraticCurveTo(24, 57, 21, 50);
      g.quadraticCurveTo(14, 44, 19, 40);
      g.bezierCurveTo(13, 30, 14, 9, 32, 9);
      g.closePath();
    }, 1.4, 'rgba(20,50,90,0.9)');
    for (const ex of [27, 37]) {
      g.beginPath();
      g.ellipse(ex, 28, 3, 4.6, 0, 0, TAU);
      g.fillStyle = '#0b1020';
      g.fill();
      dot(g, ex, 26.8, 1, '#9ff3ff');
    }
    g.beginPath();
    g.ellipse(32, 37, 2.4, 3, 0, 0, TAU);
    g.fillStyle = '#0b1020';
    g.fill();
  }

  function drawMage(g, f) {
    const orbR = f ? 5.4 : 4.2;
    shadow(g, 32, 58, 14, 4.5);
    P(g, '#2f3c8f', (g) => {
      g.moveTo(20, 58 + (f ? -1 : 0));
      g.quadraticCurveTo(22, 36, 32, 34);
      g.quadraticCurveTo(42, 36, 44, 58 + (f ? 0 : -1));
      g.closePath();
    }, 2);
    line(g, [[21, 47], [43, 47]], '#e0b84a', 1.8);
    // rosto e chapéu
    P(g, '#f1d0b0', (g) => g.ellipse(32, 37, 5.2, 5, 0, 0, TAU), 1.2);
    dot(g, 30, 37, 0.9, INK);
    dot(g, 34, 37, 0.9, INK);
    P(g, '#2a2f75', (g) => {
      g.moveTo(32, 4);
      g.lineTo(19, 30);
      g.lineTo(45, 30);
      g.closePath();
    }, 2);
    P(g, '#2a2f75', (g) => g.ellipse(32, 31, 15, 3.4, 0, 0, TAU), 1.8);
    dot(g, 28, 20, 1.2, '#ffe066');
    dot(g, 36, 14, 1, '#ffe066');
    // cajado
    line(g, [[46, 58], [50, 22]], '#6a4a2e', 2.2);
    dot(g, 50, 18, orbR + 4.5, 'rgba(255,95,210,0.25)');
    P(g, radial(g, 49, 17, 1, orbR, [
      [0, '#ffe3f7'],
      [1, '#d63fa8'],
    ]), (g) => g.arc(50, 18, orbR, 0, TAU), 1.2);
  }

  // ---------- Chefes ----------

  function drawTreant(g, f) {
    const sw = f ? 2 : -2;
    shadow(g, 64, 122, 46, 8);
    // raízes
    const roots = [
      [[58, 116], [40, 122], [22, 118]],
      [[70, 116], [88, 122], [106, 118]],
      [[62, 118], [56, 126], [46, 126]],
      [[66, 118], [72, 126], [82, 126]],
    ];
    for (const r of roots) {
      line(g, [[r[0][0], r[0][1]], [r[1][0], r[1][1]], [r[2][0], r[2][1]]], '#4a3320', 7);
      line(g, [[r[0][0], r[0][1] - 1.5], [r[1][0], r[1][1] - 1.5], [r[2][0], r[2][1] - 1.5]], '#7a5530', 2);
    }
    // tronco
    P(g, radial(g, 60, 90, 4, 46, [
      [0, '#9a6b3a'],
      [1, '#4a3020'],
    ]), (g) => {
      g.moveTo(48, 62);
      g.lineTo(80, 62);
      g.quadraticCurveTo(90, 92, 88, 120);
      g.lineTo(40, 120);
      g.quadraticCurveTo(38, 92, 48, 62);
      g.closePath();
    }, 3);
    for (const x of [52, 62, 74]) line(g, [[x, 70], [x + sw * 0.6, 118]], 'rgba(50,30,15,0.45)', 2);
    // rosto
    for (const ex of [56, 72]) {
      g.beginPath();
      g.ellipse(ex, 82, 5.2, 4.2, 0, 0, TAU);
      g.fillStyle = '#ffd34a';
      g.fill();
      dot(g, ex + 0.6, 82.5, 2, INK);
    }
    P(g, '#2a1a0c', (g) => {
      g.moveTo(54, 96);
      g.lineTo(60, 102);
      g.lineTo(64, 96);
      g.lineTo(68, 102);
      g.lineTo(74, 96);
      g.lineTo(72, 106);
      g.lineTo(56, 106);
      g.closePath();
    }, 1.4);
    // copa
    const leaves = [
      [64, 38, 30, '#4a8a3a'],
      [36 + sw, 48, 22, '#5ea84a'],
      [92 - sw, 48, 22, '#5ea84a'],
      [48, 24, 18, '#6bbf55'],
      [80, 22, 18, '#6bbf55'],
    ];
    for (const [x, y, r, col] of leaves) P(g, col, (g) => g.arc(x, y, r, 0, TAU), 3, '#1d3a18');
    for (const [x, y] of [[54, 32], [78, 34], [40, 42], [88, 40], [64, 24]]) {
      dot(g, x, y, 2.6, 'rgba(255,230,140,0.8)');
    }
  }

  function drawKing(g, f) {
    const a = f ? 2 : 0;
    shadow(g, 64, 124, 52, 9);
    // pernas
    P(g, '#2b2630', (g) => g.rect(40, 94, 20, 28), 3);
    P(g, '#2b2630', (g) => g.rect(68, 94, 20, 28), 3);
    line(g, [[48, 100], [52, 112], [46, 120]], '#ff7a2a', 2);
    line(g, [[76, 104], [72, 114], [80, 120]], '#ff7a2a', 2);
    // braços
    P(g, '#332d3a', (g) => g.roundRect ? g.roundRect(10, 50 + a, 22, 50, 6) : g.rect(10, 50 + a, 22, 50), 3);
    P(g, '#332d3a', (g) => g.roundRect ? g.roundRect(96, 50 - a, 22, 50, 6) : g.rect(96, 50 - a, 22, 50), 3);
    line(g, [[16, 70 + a], [24, 84 + a]], '#ff7a2a', 2);
    line(g, [[110, 70 - a], [102, 86 - a]], '#ff7a2a', 2);
    // torso
    P(g, '#2b2630', (g) => {
      g.moveTo(30, 46);
      g.lineTo(98, 46);
      g.lineTo(106, 84);
      g.lineTo(90, 100);
      g.lineTo(38, 100);
      g.lineTo(22, 84);
      g.closePath();
    }, 3);
    line(g, [[46, 56], [56, 70], [48, 84], [60, 96]], '#ff7a2a', 2.4);
    line(g, [[82, 56], [72, 72], [84, 86]], '#ff7a2a', 2.2);
    // cabeça e coroa
    P(g, '#3a3442', (g) => {
      g.moveTo(48, 48);
      g.lineTo(80, 48);
      g.lineTo(86, 24);
      g.lineTo(42, 24);
      g.closePath();
    }, 3);
    for (const [x, h] of [[46, 20], [56, 30], [64, 36], [72, 30], [82, 20]]) {
      P(g, '#ffb347', (g) => {
        g.moveTo(x - 5, 26);
        g.lineTo(x, 26 - h);
        g.lineTo(x + 5, 26);
        g.closePath();
      }, 1.8);
    }
    line(g, [[54, 36], [61, 36]], '#ffb347', 3);
    line(g, [[67, 36], [74, 36]], '#ffb347', 3);
  }

  function drawEclipse(g, f) {
    const spin = f ? 0.2 : 0;
    // halo e corona de eclipse
    g.beginPath();
    g.arc(64, 48, 46, 0, TAU);
    g.fillStyle = radial(g, 64, 48, 36, 50, [
      [0, 'rgba(255,207,90,0.5)'],
      [1, 'rgba(255,207,90,0)'],
    ]);
    g.fill();
    g.beginPath();
    g.arc(64, 48, 36, 0, TAU);
    g.fillStyle = '#0d0a18';
    g.fill();
    g.beginPath();
    g.arc(64, 48, 37.5, spin, spin + TAU * 0.92);
    g.strokeStyle = '#ffcf5a';
    g.lineWidth = 3.4;
    g.stroke();
    // manto
    P(g, '#1d1333', (g) => {
      g.moveTo(30, 62);
      g.lineTo(98, 62);
      g.lineTo(120, 124);
      g.lineTo(8, 124);
      g.closePath();
    }, 3, '#0a0614');
    line(g, [[30, 62], [18, 118]], '#6b3fa8', 2);
    line(g, [[98, 62], [110, 118]], '#6b3fa8', 2);
    // capuz
    P(g, '#241a40', (g) => {
      g.moveTo(38, 60);
      g.quadraticCurveTo(64, 38, 90, 60);
      g.lineTo(86, 74);
      g.quadraticCurveTo(64, 66, 42, 74);
      g.closePath();
    }, 2.4, '#0a0614');
    for (const ex of [56, 72]) {
      g.beginPath();
      g.ellipse(ex, 66, 4.2, 2.2, 0, 0, TAU);
      g.fillStyle = '#ffcf5a';
      g.fill();
    }
    // orbe nas mãos
    P(g, radial(g, 62, 96, 1, 12, [
      [0, '#fff3c4'],
      [0.5, '#ffcf5a'],
      [1, '#6b3fa8'],
    ]), (g) => g.arc(64, 96, 10, 0, TAU), 1.6, '#0a0614');
    // fumaça de sombra
    for (let i = 0; i < 3; i++) {
      line(g, [[20 + i * 14, 120], [14 + i * 14, 102 + (f ? 4 : 0)], [24 + i * 14, 92]], 'rgba(160,110,230,0.45)', 2.2);
    }
  }

  // ---------- Projéteis e coletáveis (unidades 32) ----------

  function drawArrow(g, enemy) {
    const fletch = enemy ? '#ff6b6b' : '#7ad16b';
    const head = enemy ? '#2b2233' : '#cfd8e3';
    line(g, [[4, 16], [24, 16]], enemy ? '#7a2d3a' : '#c8a06a', 2.2);
    P(g, fletch, (g) => {
      g.moveTo(4, 16);
      g.lineTo(0, 10);
      g.lineTo(8, 16);
      g.closePath();
    }, 1);
    P(g, fletch, (g) => {
      g.moveTo(4, 16);
      g.lineTo(0, 22);
      g.lineTo(8, 16);
      g.closePath();
    }, 1);
    P(g, head, (g) => {
      g.moveTo(22, 11.5);
      g.lineTo(30, 16);
      g.lineTo(22, 20.5);
      g.closePath();
    }, 1.2);
  }

  function drawOrb(g, color, core) {
    const grad = radial(g, 16, 16, 1, 15, [
      [0, core],
      [0.35, color],
      [1, 'rgba(0,0,0,0)'],
    ]);
    g.beginPath();
    g.arc(16, 16, 15, 0, TAU);
    g.fillStyle = grad;
    g.fill();
  }

  function drawStarBurst(g, color) {
    g.beginPath();
    for (let i = 0; i < 16; i++) {
      const r = i % 2 ? 8 : 14;
      const a = (i / 16) * TAU;
      g[i ? 'lineTo' : 'moveTo'](16 + Math.cos(a) * r, 16 + Math.sin(a) * r);
    }
    g.closePath();
    g.fillStyle = color;
    g.fill();
    g.lineWidth = 1.4;
    g.strokeStyle = INK;
    g.stroke();
  }

  function drawBoulder(g) {
    P(g, radial(g, 12, 10, 2, 16, [
      [0, '#9a939f'],
      [1, '#4f4955'],
    ]), (g) => g.arc(16, 16, 12, 0, TAU), 2);
    line(g, [[10, 12], [15, 17], [13, 22]], 'rgba(20,15,25,0.6)', 1.2);
    line(g, [[19, 9], [22, 14]], 'rgba(20,15,25,0.5)', 1.1);
  }

  function drawSeed(g) {
    for (let i = 0; i < 6; i++) {
      const a = (i / 6) * TAU;
      line(g, [[12 + Math.cos(a) * 6, 12 + Math.sin(a) * 6], [12 + Math.cos(a) * 10, 12 + Math.sin(a) * 10]], '#3f6b2a', 1.4);
    }
    P(g, '#8fd16c', (g) => g.ellipse(12, 12, 6.5, 5, 0, 0, TAU), 1.4);
    dot(g, 10, 10, 1.4, '#e9ffd6');
  }

  function drawBlade(g) {
    g.beginPath();
    g.arc(16, 16, 13, -1.25, 1.25);
    g.arc(20, 16, 10.5, 1.25, -1.25, true);
    g.closePath();
    g.fillStyle = '#2a1f3d';
    g.fill();
    g.lineWidth = 1.6;
    g.strokeStyle = '#ffcf5a';
    g.stroke();
  }

  function drawWeb(g) {
    for (let i = 0; i < 8; i++) {
      const a = (i / 8) * TAU;
      line(g, [[16, 16], [16 + Math.cos(a) * 14, 16 + Math.sin(a) * 14]], 'rgba(240,240,255,0.85)', 1.4);
    }
    for (const r of [5, 10]) {
      g.beginPath();
      g.arc(16, 16, r, 0, TAU);
      g.strokeStyle = 'rgba(240,240,255,0.7)';
      g.lineWidth = 1.2;
      g.stroke();
    }
  }

  function drawCoin(g) {
    dot(g, 16, 17, 12, '#8a5a0b');
    P(g, radial(g, 12, 10, 1, 14, [
      [0, '#fff1a6'],
      [1, '#e0a526'],
    ]), (g) => g.arc(16, 16, 12, 0, TAU), 1.8);
    P(g, null, (g) => g.arc(16, 16, 7.2, 0, TAU), 1.2, '#b8860b');
    dot(g, 13, 11, 2, 'rgba(255,255,255,0.7)');
  }

  function drawGem(g) {
    const pts = [[16, 3], [27, 12], [16, 29], [5, 12]];
    P(g, radial(g, 12, 8, 1, 22, [
      [0, '#e6fbff'],
      [0.5, '#4ac8ff'],
      [1, '#1b4aa8'],
    ]), (g) => {
      g.moveTo(pts[0][0], pts[0][1]);
      for (const p of pts.slice(1)) g.lineTo(p[0], p[1]);
      g.closePath();
    }, 1.6);
    line(g, [[5, 12], [27, 12]], 'rgba(255,255,255,0.6)', 1);
    line(g, [[16, 3], [11, 12], [16, 29]], 'rgba(255,255,255,0.35)', 1);
  }

  function drawHeart(g) {
    P(g, radial(g, 12, 10, 1, 16, [
      [0, '#ffb3c1'],
      [1, '#d7264a'],
    ]), (g) => {
      g.moveTo(16, 27);
      g.bezierCurveTo(2, 18, 1, 9, 8, 6);
      g.bezierCurveTo(12, 4, 15, 7, 16, 11);
      g.bezierCurveTo(17, 7, 20, 4, 24, 6);
      g.bezierCurveTo(31, 9, 30, 18, 16, 27);
      g.closePath();
    }, 1.8);
    dot(g, 10, 10, 1.6, 'rgba(255,255,255,0.7)');
  }

  function drawXp(g) {
    dot(g, 16, 16, 15, 'rgba(120,255,230,0.35)');
    P(g, radial(g, 14, 14, 0.5, 8, [
      [0, '#ffffff'],
      [0.4, '#9ffff0'],
      [1, '#20b8a0'],
    ]), (g) => g.arc(16, 16, 7, 0, TAU), 1);
  }

  function drawPotion(g) {
    P(g, '#8a5a2e', (g) => g.rect(12.5, 3, 7, 6), 1.4);
    P(g, radial(g, 12, 20, 1, 12, [
      [0, '#d9ffd0'],
      [1, '#2e9e4a'],
    ]), (g) => {
      g.moveTo(12.5, 9);
      g.lineTo(12.5, 12);
      g.quadraticCurveTo(4, 16, 6, 24);
      g.quadraticCurveTo(10, 30, 16, 30);
      g.quadraticCurveTo(22, 30, 26, 24);
      g.quadraticCurveTo(28, 16, 19.5, 12);
      g.lineTo(19.5, 9);
      g.closePath();
    }, 1.6);
    line(g, [[9, 22], [11, 26]], 'rgba(255,255,255,0.6)', 1.4);
  }

  // ---------- Retratos (bustos) ----------

  function drawBust(g, p) {
    const bg = g.createRadialGradient(64, 60, 10, 64, 64, 96);
    bg.addColorStop(0, p.halo || '#4a3a6a');
    bg.addColorStop(1, '#120e1c');
    g.fillStyle = bg;
    g.fillRect(0, 0, 128, 128);
    // ombros
    P(g, p.cloak, (g) => {
      g.moveTo(10, 128);
      g.quadraticCurveTo(14, 92, 64, 88);
      g.quadraticCurveTo(114, 92, 118, 128);
      g.closePath();
    }, 2.4);
    if (p.trim) line(g, [[24, 110], [64, 96], [104, 110]], p.trim, 2);
    // pescoço
    P(g, p.skinShade || '#d9b08a', (g) => g.rect(54, 72, 20, 20), 1.6);
    // cabelo de trás
    if (p.hair === 'long') {
      P(g, p.hairCol, (g) => g.ellipse(64, 66, 30, 36, 0, 0, TAU), 2);
    }
    if (p.hood) {
      P(g, p.cloakDark || p.cloak, (g) => g.ellipse(64, 56, 33, 40, 0, 0, TAU), 2.4);
    }
    // rosto
    P(g, p.skin, (g) => g.ellipse(64, 60, 23, 27, 0, 0, TAU), 2);
    // cabelo / capuz da frente
    if (p.hair === 'short') {
      P(g, p.hairCol, (g) => {
        g.moveTo(40, 58);
        g.quadraticCurveTo(38, 30, 64, 30);
        g.quadraticCurveTo(92, 30, 88, 58);
        g.quadraticCurveTo(80, 44, 64, 42);
        g.quadraticCurveTo(50, 44, 40, 58);
        g.closePath();
      }, 2);
    }
    if (p.hair === 'long') {
      P(g, p.hairCol, (g) => {
        g.moveTo(40, 60);
        g.quadraticCurveTo(38, 32, 64, 33);
        g.quadraticCurveTo(90, 32, 88, 60);
        g.quadraticCurveTo(82, 44, 64, 42);
        g.quadraticCurveTo(46, 44, 40, 60);
        g.closePath();
      }, 2);
    }
    if (p.hair === 'bald') {
      line(g, [[46, 42], [82, 42]], 'rgba(0,0,0,0.12)', 2);
    }
    if (p.hood) {
      P(g, p.cloakDark || p.cloak, (g) => {
        g.moveTo(38, 60);
        g.quadraticCurveTo(64, 28, 90, 60);
        g.quadraticCurveTo(84, 46, 64, 44);
        g.quadraticCurveTo(44, 46, 38, 60);
        g.closePath();
      }, 2);
    }
    if (p.beard) {
      P(g, p.beard, (g) => {
        g.moveTo(42, 72);
        g.quadraticCurveTo(64, 112, 86, 72);
        g.quadraticCurveTo(80, 84, 64, 84);
        g.quadraticCurveTo(48, 84, 42, 72);
        g.closePath();
      }, 1.6);
    }
    // olhos e boca
    const eyeY = 62;
    for (const ex of [54, 74]) {
      if (p.glow) {
        dot(g, ex, eyeY, 7, p.glow);
      }
      dot(g, ex, eyeY, 3.2, p.eye || '#24182e');
      dot(g, ex + 0.9, eyeY - 0.9, 1, '#fff');
    }
    if (p.brow) line(g, [[46, 52], [60, 54]], p.brow, 2.4);
    if (p.brow) line(g, [[68, 54], [82, 52]], p.brow, 2.4);
    if (p.mouth === 'smile') {
      g.beginPath();
      g.arc(64, 76, 6, 0.2, Math.PI - 0.2);
      g.strokeStyle = '#7a3b3b';
      g.lineWidth = 2;
      g.stroke();
    } else if (p.mouth === 'jagged') {
      line(g, [[52, 82], [58, 86], [64, 82], [70, 86], [76, 82]], '#2a0f10', 2.2);
    } else {
      line(g, [[58, 80], [70, 80]], '#7a3b3b', 2);
    }
    // acessórios
    if (p.accessory === 'circlet') {
      line(g, [[42, 40], [64, 36], [86, 40]], '#e0b84a', 3);
      dot(g, 64, 36, 3, '#ffcf5a');
    }
    if (p.accessory === 'crown_root') {
      for (const [x, h] of [[44, 14], [54, 22], [64, 28], [74, 22], [84, 14]]) {
        P(g, '#6bbf55', (g) => {
          g.moveTo(x - 4, 36);
          g.quadraticCurveTo(x, 36 - h, x + 4, 36);
          g.closePath();
        }, 1.4, '#1d3a18');
      }
    }
    if (p.accessory === 'crown_obs') {
      for (const [x, h] of [[44, 18], [54, 26], [64, 32], [74, 26], [84, 18]]) {
        P(g, '#ffb347', (g) => {
          g.moveTo(x - 5, 38);
          g.lineTo(x, 38 - h);
          g.lineTo(x + 5, 38);
          g.closePath();
        }, 1.6);
      }
    }
    if (p.accessory === 'halo') {
      g.beginPath();
      g.arc(64, 60, 40, 0, TAU);
      g.strokeStyle = 'rgba(255,207,90,0.35)';
      g.lineWidth = 9;
      g.stroke();
      g.beginPath();
      g.arc(64, 60, 40, 0, TAU);
      g.strokeStyle = '#ffcf5a';
      g.lineWidth = 3;
      g.stroke();
    }
    if (p.accessory === 'hat') {
      P(g, '#2a2f75', (g) => {
        g.moveTo(64, 2);
        g.lineTo(38, 40);
        g.lineTo(90, 40);
        g.closePath();
      }, 2);
      P(g, '#2a2f75', (g) => g.ellipse(64, 40, 30, 6, 0, 0, TAU), 2);
    }
  }

  // ---------- Pisos e obstáculos por cenário ----------

  function drawFloor(g, w, h, theme, rng) {
    g.fillStyle = theme.a;
    g.fillRect(0, 0, w, h);
    const T = 24;
    for (let y = 0; y < h; y += T) {
      for (let x = 0; x < w; x += T) {
        if (((x / T) + (y / T)) % 2 === 0) {
          g.fillStyle = theme.b;
          g.fillRect(x, y, T, T);
        }
        g.fillStyle = theme.dots;
        for (let i = 0; i < 2; i++) {
          g.globalAlpha = 0.35 + rng.next() * 0.3;
          g.beginPath();
          g.arc(x + rng.next() * T, y + rng.next() * T, 0.8 + rng.next() * 1.2, 0, TAU);
          g.fill();
        }
        g.globalAlpha = 1;
      }
    }
    // rachaduras e acentos suaves
    g.strokeStyle = theme.dots;
    g.lineWidth = 1;
    for (let i = 0; i < 26; i++) {
      const x = rng.next() * w;
      const y = rng.next() * h;
      g.beginPath();
      g.moveTo(x, y);
      g.lineTo(x + (rng.next() - 0.5) * 22, y + (rng.next() - 0.5) * 22);
      g.stroke();
    }
    g.globalAlpha = 0.5;
    for (let i = 0; i < 9; i++) {
      dot(g, rng.next() * w, rng.next() * h, 1.6, theme.glow);
    }
    g.globalAlpha = 1;
  }

  function drawObstacle(g, kind, theme) {
    const acc = theme.accent;
    if (kind === 'bush') {
      shadow(g, 32, 52, 22, 6);
      for (const [x, y, r] of [[20, 34, 14], [44, 34, 14], [32, 24, 16], [32, 40, 14]]) {
        P(g, radial(g, x - 3, y - 4, 2, r + 2, [
          [0, '#8fd16c'],
          [1, '#2a5a2a'],
        ]), (g) => g.arc(x, y, r, 0, TAU), 2.2, '#152a16');
      }
      dot(g, 26, 22, 2, acc);
      dot(g, 40, 31, 1.6, acc);
    } else if (kind === 'rock') {
      shadow(g, 32, 52, 24, 6);
      P(g, radial(g, 24, 26, 2, 30, [
        [0, '#a9a2b3'],
        [1, '#4a4454'],
      ]), (g) => {
        g.moveTo(10, 48);
        g.lineTo(14, 26);
        g.lineTo(28, 14);
        g.lineTo(46, 16);
        g.lineTo(54, 34);
        g.lineTo(50, 48);
        g.closePath();
      }, 2.4);
      line(g, [[24, 24], [30, 34], [26, 44]], 'rgba(20,15,25,0.5)', 1.6);
      line(g, [[38, 22], [44, 30]], 'rgba(255,255,255,0.25)', 2);
    } else if (kind === 'pillar') {
      shadow(g, 32, 56, 20, 6);
      P(g, '#8d8798', (g) => g.rect(16, 14, 32, 40), 2.2);
      P(g, '#b3adbd', (g) => g.rect(12, 8, 40, 8), 2);
      P(g, '#6b6577', (g) => g.rect(12, 50, 40, 6), 2);
      line(g, [[24, 16], [24, 50]], 'rgba(0,0,0,0.18)', 2);
      line(g, [[40, 16], [40, 50]], 'rgba(255,255,255,0.18)', 2);
      dot(g, 32, 30, 2.2, acc);
    } else if (kind === 'crystal') {
      shadow(g, 32, 54, 20, 5);
      const shards = [
        [22, 50, 0.2, 26, 9],
        [34, 52, -0.1, 34, 11],
        [46, 48, 0.25, 22, 8],
      ];
      for (const [x, y, tilt, hgt, w] of shards) {
        P(g, radial(g, x, y - hgt / 2, 1, hgt, [
          [0, '#ffffff'],
          [0.4, acc],
          [1, '#2a1f3d'],
        ]), (g) => {
          g.moveTo(x - w / 2, y);
          g.lineTo(x + tilt * 8, y - hgt);
          g.lineTo(x + w / 2, y);
          g.closePath();
        }, 1.8, '#1a1020');
      }
    } else {
      P(g, '#6b4a2e', (g) => g.rect(24, 30, 16, 22), 2);
      P(g, '#3f7a3a', (g) => g.arc(32, 22, 16, 0, TAU), 2.2, '#16301a');
    }
  }

    heart: { units: 32, px: 64, draw: (g) => drawHeart(g) },
    xp: { units: 32, px: 64, draw: (g) => drawXp(g) },
    potion: { units: 32, px: 64, draw: (g) => drawPotion(g) },
  };

  const BUSTS = {
    ysa: {
      skin: '#f2cfa4', skinShade: '#d9ae84', hair: 'long', hairCol: '#3a2a5a', cloak: '#2f8f86', cloakDark: '#1d5a56',
      hood: true, eye: '#2a4e6e', mouth: 'smile', halo: '#2a5a58', trim: '#ffd166', accessory: null,
    },
    iolen: {
      skin: '#e8c4a0', skinShade: '#c99c74', hair: 'short', hairCol: '#ddd8e6', cloak: '#6a3a8a', beard: null,
      eye: '#3d2a1a', mouth: 'smile', halo: '#3a2a5a', trim: '#e0b84a', accessory: 'circlet', brow: '#bdb6c9',
    },
    gorm: {
      skin: '#e0b48a', skinShade: '#b98a62', hair: 'bald', cloak: '#7a4b2a', beard: '#8a5a3a', eye: '#1f1812',
      mouth: 'line', halo: '#4a3420', trim: '#ffb347', accessory: null, brow: '#5a3a22',
    },
    mirra: {
      skin: '#cfc3e6', skinShade: '#a79ac8', hair: 'long', hairCol: '#1d1a3a', cloak: '#2a2f75', cloakDark: '#1a1f55',
      hood: true, eye: '#9ff3ff', mouth: 'line', halo: '#2a2a5a', trim: '#b48cff', glow: 'rgba(159,243,255,0.35)',
    },
    treant: {
      skin: '#7a5530', skinShade: '#5a3b20', hair: 'short', hairCol: '#4a8a3a', cloak: '#3d2a18', eye: '#ffd34a',
      mouth: 'jagged', halo: '#1d3a18', trim: '#6bbf55', accessory: 'crown_root', brow: '#2a1a0c', glow: 'rgba(255,211,74,0.35)',
    },
    king: {
      skin: '#3a3442', skinShade: '#2b2630', hair: 'bald', cloak: '#2b2630', eye: '#ffb347', mouth: 'jagged',
      halo: '#3a2014', trim: '#ff7a2a', accessory: 'crown_obs', brow: '#ff7a2a', glow: 'rgba(255,179,71,0.35)',
    },
    eclipse: {
      skin: '#120c20', skinShade: '#0b0716', hair: 'bald', cloak: '#1d1333', cloakDark: '#241a40', hood: true,
      eye: '#ffcf5a', mouth: 'line', halo: '#2a1a40', trim: '#6b3fa8', accessory: 'halo', glow: 'rgba(255,207,90,0.4)',
    },
  };

  const CACHE_BUSTS = {};

  const Sprites = {
    THEMES,

    // Desenha um sprite de entidade centralizado em (x, y), com tamanho "size" em pixels lógicos.
    draw(g, id, x, y, size, o = {}) {
      const img = get(id, o.frame || 0);
      g.save();
      if (o.alpha != null) g.globalAlpha *= o.alpha;
      g.translate(x, y);
      if (o.rot) g.rotate(o.rot);
      if (o.flip) g.scale(-1, 1);
      g.drawImage(img, -size / 2, -size / 2, size, size);
      g.restore();
    },

    // Retrato (bustos) para as cenas de história.
    bust(id) {
      if (!CACHE_BUSTS[id]) {
        const p = BUSTS[id];
        CACHE_BUSTS[id] = sprite(128, 256, (g) => drawBust(g, p));
      }
      return CACHE_BUSTS[id];
    },

    // Piso de sala, cacheado por tema e semente.
    floor(themeId, w, h, seed) {
      const key = `floor:${themeId}:${w}x${h}:${seed}`;
      return cached(key, () => {
        const c = makeCanvas(w * 2, h * 2);
        const g = c.getContext('2d');
        g.scale(2, 2);
        drawFloor(g, w, h, THEMES[themeId], V.Util.makeRng(seed));
        return c;
      });
    },

    // Obstáculo (bloqueante) cacheado por tema e tipo.
    obstacle(themeId, kind, w, h) {
      const key = `obs:${themeId}:${kind}:${w}x${h}`;
      return cached(key, () => {
        const c = makeCanvas(w * 2, h * 2);
        const g = c.getContext('2d');
        g.scale(2 * w / 64, 2 * h / 64);
        drawObstacle(g, kind, THEMES[themeId]);
        return c;
      });
    },

    has(id) {
      return Object.prototype.hasOwnProperty.call(DEFS, id);
    },
  };

  function get(id, frame) {
    const key = `${id}:${frame ? 1 : 0}`;
    let c = cache.get(key);
    if (!c) {
      const def = DEFS[id];
      if (!def) throw new Error('Sprite desconhecido: ' + id);
      c = sprite(def.units, def.px, (g) => def.draw(g, frame ? 1 : 0));
      cache.set(key, c);
    }
    return c;
  }

  function cached(key, make) {
    let c = cache.get(key);
    if (!c) {
      c = make();
      cache.set(key, c);
    }
    return c;
  }

  V.Sprites = Sprites;
})();

  <script>
/* js/core/ui.js */
// Componentes de interface desenhados no canvas: botões, painéis, barras, texto e ícones.
(() => {
  const V = (window.V = window.V || {});
  const { FONT, FONT_TITLE, wrapText, TAU } = V.Util;

  const UI = {
    // Texto com sombra opcional. Retorna a altura total usada.
    text(g, str, x, y, o = {}) {
      const size = o.size || 16;
      g.font = `${o.weight || ''} ${size}px ${o.font || FONT}`.trim();
      g.textAlign = o.align || 'left';
      g.textBaseline = o.baseline || 'top';
      const lines = o.maxW ? wrapText(g, str, o.maxW) : String(str).split('\n');
      const lh = o.lineH || Math.round(size * 1.3);
      for (let i = 0; i < lines.length; i++) {
        const ly = y + i * lh;
        if (o.stroke) {
          g.lineWidth = o.strokeW || 4;
          g.strokeStyle = o.stroke;
          g.lineJoin = 'round';
          g.strokeText(lines[i], x, ly);
        }
        if (o.shadow !== false) {
          g.fillStyle = o.shadowColor || 'rgba(0,0,0,0.45)';
          g.fillText(lines[i], x, ly + Math.max(1, Math.round(size / 12)));
        }
        g.fillStyle = o.color || '#f4eefc';
        g.fillText(lines[i], x, ly);
      }
      return lines.length * lh;
    },

    title(g, str, x, y, o = {}) {
      return UI.text(g, str, x, y, { font: FONT_TITLE, weight: 'bold', size: 28, color: '#ffd77a', stroke: '#2a1408', strokeW: 6, ...o });
    },

    panel(g, x, y, w, h, o = {}) {
      const r = o.r == null ? 12 : o.r;
      roundRect(g, x, y, w, h, r);
      g.fillStyle = o.fill || 'rgba(18,12,30,0.86)';
      g.fill();
      g.lineWidth = o.lw || 2;
      g.strokeStyle = o.stroke || 'rgba(255,215,122,0.55)';
      g.stroke();
    },

    // Botão com estados normal/pressionado/desabilitado.
    button(g, b) {
      const { x, y, w, h, label } = b;
      const pressed = b.pressed;
      const dis = b.disabled;
      const base = b.color || '#7a4fd6';
      const top = dis ? '#4a4558' : shade(base, pressed ? -20 : 25);
      const bot = dis ? '#34303d' : shade(base, pressed ? -45 : -15);
      const oy = pressed ? 2 : 0;
      roundRect(g, x, y + 4, w, h, 14);
      g.fillStyle = 'rgba(0,0,0,0.35)';
      g.fill();
      roundRect(g, x, y + oy, w, h, 14);
      const grad = g.createLinearGradient(0, y, 0, y + h);
      grad.addColorStop(0, top);
      grad.addColorStop(1, bot);
      g.fillStyle = grad;
      g.fill();
      g.lineWidth = 2;
      g.strokeStyle = dis ? '#55506a' : '#ffe9b0';
      g.stroke();
      UI.text(g, label, x + w / 2, y + h / 2 + oy, {
        size: b.size || 20,
        align: 'center',
        baseline: 'middle',
        weight: 'bold',
        color: dis ? '#9a95a8' : '#fff9ec',
        stroke: 'rgba(20,10,30,0.6)',
        strokeW: 3,
        shadow: false,
      });
    },

    hit(r, x, y) {
      return x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h;
    },

    // Barra horizontal com fundo, preenchimento e brilho.
    bar(g, x, y, w, h, frac, colA, colB, bg = 'rgba(0,0,0,0.5)') {
      roundRect(g, x, y, w, h, h / 2);
      g.fillStyle = bg;
      g.fill();
      const fw = Math.max(0, Math.min(1, frac)) * w;
      if (fw > 0.5) {
        roundRect(g, x, y, fw, h, h / 2);
        const grad = g.createLinearGradient(0, y, 0, y + h);
        grad.addColorStop(0, colA);
        grad.addColorStop(1, colB || colA);
        g.fillStyle = grad;
        g.fill();
      }
      g.lineWidth = 1.2;
      g.strokeStyle = 'rgba(255,255,255,0.25)';
      roundRect(g, x, y, w, h, h / 2);
      g.stroke();
    },

    backdrop(g, w, h, top, bottom) {
      const grad = g.createLinearGradient(0, 0, 0, h);
      grad.addColorStop(0, top);
      grad.addColorStop(1, bottom);
      g.fillStyle = grad;
      g.fillRect(0, 0, w, h);
    },

    // Estrelas decorativas determinísticas (mesmo padrão a cada quadro).
    stars(g, w, h, t, count = 60, seed = 7) {
      const rng = V.Util.makeRng(seed);
      for (let i = 0; i < count; i++) {
        const x = rng.next() * w;
        const y = rng.next() * h;
        const s = 0.5 + rng.next() * 1.4;
        const a = 0.35 + 0.45 * Math.sin(t * (1 + rng.next() * 2) + i);
        g.globalAlpha = Math.max(0.05, a);
        g.fillStyle = '#fff3d6';
        g.beginPath();
        g.arc(x, y, s, 0, TAU);
        g.fill();
      }
      g.globalAlpha = 1;
    },

    // Ícones vetoriais simples para cartas e menus.
    icon(g, name, cx, cy, s) {
      g.save();
      g.translate(cx, cy);
      const k = s / 32;
      g.scale(k, k);
      g.lineCap = 'round';
      g.lineJoin = 'round';
      const stroke = (c, lw) => {
        g.strokeStyle = c;
        g.lineWidth = lw || 3;
        g.stroke();
      };
      const fillc = (c) => {
        g.fillStyle = c;
        g.fill();
      };
      switch (name) {
        case 'arrow':
          g.beginPath(); g.moveTo(-12, 0); g.lineTo(11, 0); stroke('#e8c48a', 3);
          g.beginPath(); g.moveTo(10, -5); g.lineTo(15, 0); g.lineTo(10, 5); g.closePath(); fillc('#dfe8f2');
          break;
        case 'multi':
          for (const a of [-0.35, 0, 0.35]) {
            g.save(); g.rotate(a); g.beginPath(); g.moveTo(-10, 0); g.lineTo(12, 0); stroke('#8fd6ff', 2.6); g.restore();
          }
          break;
        case 'heart':
          g.beginPath(); g.moveTo(0, 12); g.bezierCurveTo(-16, 0, -12, -14, 0, -6); g.bezierCurveTo(12, -14, 16, 0, 0, 12); fillc('#ff4d6d');
          break;
        case 'speed':
          g.beginPath(); g.moveTo(-12, -6); g.lineTo(2, -6); g.lineTo(-2, 0); g.lineTo(10, 0); stroke('#9fffb0', 3);
          g.beginPath(); g.moveTo(-12, 6); g.lineTo(2, 6); g.lineTo(-2, 0); stroke('#9fffb0', 3);
          break;
        case 'crit':
          g.beginPath(); for (let i = 0; i < 8; i++) { const r = i % 2 ? 6 : 15; const a = (i / 8) * TAU; g[i ? 'lineTo' : 'moveTo'](Math.cos(a) * r, Math.sin(a) * r); } g.closePath(); fillc('#ffd166'); stroke('#7a4a00', 1.5);
          break;
        case 'pierce':
          g.beginPath(); g.moveTo(-14, -8); g.lineTo(12, 0); g.lineTo(-14, 8); g.closePath(); fillc('#c9b6ff'); stroke('#3d2a6b', 1.5);
          g.beginPath(); g.arc(9, 0, 2, 0, TAU); fillc('#ffffff');
          break;
        case 'bounce':
          g.beginPath(); g.moveTo(-14, 10); g.lineTo(-14, -12); stroke('#8c97ff', 3);
          g.beginPath(); g.moveTo(-14, 10); g.lineTo(0, -6); g.lineTo(14, 10); stroke('#8c97ff', 3);
          break;
        case 'fire':
          g.beginPath(); g.moveTo(0, -15); g.quadraticCurveTo(14, -2, 8, 10); g.quadraticCurveTo(0, 16, -8, 10); g.quadraticCurveTo(-14, -2, 0, -15); fillc('#ff8a3d');
          g.beginPath(); g.moveTo(0, -4); g.quadraticCurveTo(6, 4, 2, 9); g.quadraticCurveTo(-3, 11, -4, 6); fillc('#ffe066');
          break;
        case 'shield':
          g.beginPath(); g.moveTo(0, -14); g.lineTo(12, -9); g.lineTo(10, 3); g.quadraticCurveTo(6, 11, 0, 14); g.quadraticCurveTo(-6, 11, -10, 3); g.lineTo(-12, -9); g.closePath(); fillc('#58a6ff'); stroke('#12325e', 1.8);
          break;
        case 'leaf':
          g.beginPath(); g.moveTo(-12, 10); g.quadraticCurveTo(-14, -12, 12, -12); g.quadraticCurveTo(12, 8, -12, 10); fillc('#6bbf55'); stroke('#1d3a18', 1.6);
          g.beginPath(); g.moveTo(-10, 8); g.lineTo(6, -6); stroke('#1d3a18', 1.2);
          break;
        case 'vamp':
          g.beginPath(); g.arc(0, 2, 11, 0, TAU); fillc('#c2185b'); stroke('#3a0820', 1.6);
          g.beginPath(); g.arc(-4, -2, 3, 0, TAU); fillc('rgba(255,255,255,0.7)');
          break;
        case 'gold':
          g.beginPath(); g.arc(0, 0, 12, 0, TAU); fillc('#ffd54a'); stroke('#8a5a0b', 1.8);
          g.beginPath(); g.arc(0, 0, 6, 0, TAU); stroke('#b8860b', 1.4);
          break;
        case 'xp':
          g.beginPath(); g.arc(0, 0, 11, 0, TAU); fillc('rgba(120,255,230,0.5)');
          g.beginPath(); g.arc(0, 0, 6, 0, TAU); fillc('#9ffff0');
          break;
        case 'cloak':
          g.beginPath(); g.moveTo(-12, 10); g.lineTo(-6, -10); g.lineTo(6, -10); g.lineTo(12, 10); g.closePath(); fillc('#2f8f86'); stroke('#11302d', 1.6);
          break;
        case 'moon':
          g.beginPath(); g.arc(0, 0, 13, 0, TAU); fillc('#ffcf5a');
          g.beginPath(); g.arc(6, -3, 11, 0, TAU); fillc('#1b1430');
          break;
        case 'relic':
          g.beginPath(); g.moveTo(0, -14); g.lineTo(12, 0); g.lineTo(0, 14); g.lineTo(-12, 0); g.closePath(); fillc('#c9a0ff'); stroke('#3d1f6b', 1.8);
          g.beginPath(); g.moveTo(0, -14); g.lineTo(0, 14); stroke('rgba(255,255,255,0.5)', 1.2);
          break;
        case 'hp':
          g.beginPath(); g.moveTo(0, 12); g.bezierCurveTo(-16, 0, -12, -14, 0, -6); g.bezierCurveTo(12, -14, 16, 0, 0, 12); fillc('#ff6b6b');
          break;
        case 'sword':
          g.beginPath(); g.moveTo(0, -14); g.lineTo(3, 6); g.lineTo(-3, 6); g.closePath(); fillc('#dfe8f2'); stroke('#3a4150', 1.4);
          g.beginPath(); g.moveTo(-6, 7); g.lineTo(6, 7); stroke('#c9a227', 2.4);
          break;
        default:
          g.beginPath(); g.arc(0, 0, 10, 0, TAU); fillc('#888');
      }
      g.restore();
    },
  };

  function roundRect(g, x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    g.beginPath();
    g.moveTo(x + r, y);
    g.arcTo(x + w, y, x + w, y + h, r);
    g.arcTo(x + w, y + h, x, y + h, r);
    g.arcTo(x, y + h, x, y, r);
    g.arcTo(x, y, x + w, y, r);
    g.closePath();
  }

  // Escurece (negativo) ou clareia (positivo) uma cor hexadecimal #rrggbb.
  function shade(hex, amt) {
    const n = parseInt(hex.slice(1), 16);
    let r = (n >> 16) & 255;
    let gg = (n >> 8) & 255;
    let b = n & 255;
    const f = (c) => Math.max(0, Math.min(255, c + amt));
    r = f(r);
    gg = f(gg);
    b = f(b);
    return `rgb(${r},${gg},${b})`;
  }

  UI.roundRect = roundRect;
  UI.shade = shade;
  V.UI = UI;
})();

// Definições de monstros comuns e chefes. Comportamentos ficam em js/game/ai.js.
(() => {
  const V = (window.V = window.V || {});
  V.Data = V.Data || {};
