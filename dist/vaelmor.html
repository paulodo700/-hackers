/* js/scenes/gameplay.js */
// Cena de combate: arena, HUD, subida de nível, pausa e transições ao fim da sala.
(() => {
  const V = (window.V = window.V || {});
  const { UI, Audio, Run, Input } = V;

  const PAUSE_BTN = { x: 268, y: 62, w: 80, h: 26 };

  const Gameplay = {
    kind: 'combat',
    world: null,
    paused: false,
    overlay: null, // null | 'levelup' | 'pause'
    choices: [],
    hintT: 7,
    fx: 0,
    pauseBtns: [],
    finished: false,

    enter(data) {
      this.kind = data.kind || 'combat';
      this.world = new V.World(this.kind);
      this.paused = false;
      this.overlay = null;
      this.choices = [];
      this.hintT = 7;
      this.finished = false;
      this.fx = 0;
      Audio.playTrack(this.kind === 'boss' ? 'boss' : Run.chapterDef().music);
      V.Game.saveRun();
    },

    exit() {
      Input.reset();
    },

    update(dt) {
      this.fx += dt;
      if (this.overlay || this.paused || this.finished) return;
      const w = this.world;
      w.update(dt);
      if (this.hintT > 0) this.hintT -= dt;

      if (w.state === 'play' && w.pendingLevelUps > 0) {
        this.openLevelUp();
        return;
      }
      if (w.state !== 'play' && w.endT <= 0) this.finish();
    },

    // ---------- Subida de nível ----------

    openLevelUp() {
      const w = this.world;
      const pick = Run.randomCards(3);
      if (!pick.length) {
        // Todas as cartas no máximo: converte o nível em cura.
        w.pendingLevelUps--;
        Run.stats.hp = Math.min(Run.stats.maxHp, Run.stats.hp + 15);
        w.floatText(w.player.x, w.player.y - 40, 'Nível! +15 HP', '#7dff9a', 14);
        return;
      }
      this.choices = pick;
      this.overlay = 'levelup';
      Audio.sfx('levelup');
    },

    chooseCard(card) {
      Run.pickCard(card);
      this.world.pendingLevelUps--;
      this.world.floatText(this.world.player.x, this.world.player.y - 40, 'Nível ' + Run.level + '!', '#ffe9a8', 16);
      this.overlay = null;
      this.choices = [];
    },

    levelCardRects() {
      return this.choices.map((c, i) => ({ x: 28, y: 198 + i * 108, w: 304, h: 96, card: c }));
    },

    // ---------- Fim de sala ----------

    finish() {
      if (this.finished) return;
      this.finished = true;
      const w = this.world;
      if (w.state === 'lost') {
        V.Game.go('gameover', { victory: false });
        return;
      }
      // Vitória de sala
      if (this.kind === 'boss') {
        const ch = Run.chapterDef();
        const idx = Run.chapter;
        const story = V.Data.story;
        Run.advance();
        Run.stats.hp = Math.min(Run.stats.maxHp, Run.stats.hp + Math.round(Run.stats.maxHp * 0.25));
        if (Run.isFinalChapterDone()) {
          V.Game.clearRun();
          V.Game.go('story', {
            title: ch.name + ' · Fim',
            music: 'shop',
            lines: story.chapters[idx].outro,
            next: {
              name: 'story',
              data: {
                title: 'Epílogo',
                music: 'title',
                lines: story.ending,
                next: { name: 'gameover', data: { victory: true } },
              },
            },
          });
          return;
        }
        const nextCh = V.Data.chapters[Run.chapter];
        V.Game.saveRun();
        V.Game.go('story', {
          title: ch.name + ' · Fim',
          music: 'shop',
          lines: story.chapters[idx].outro,
          next: {
            name: 'story',
            data: {
              title: nextCh.name,
              music: nextCh.music,
              lines: story.chapters[Run.chapter].intro,
              next: { name: 'map', data: { banner: 'Capítulo concluído!' } },
            },
          },
        });
        return;
      }
      Run.roomsCleared++;
      Run.advance();
      V.Game.saveRun();
      const banner = this.kind === 'elite' ? 'Campeão derrotado!' : 'Sala limpa!';
      V.Game.go('map', { banner });
    },

    pauseGame() {
      if (this.finished || this.overlay) return;
      this.overlay = 'pause';
      this.paused = true;
      Audio.sfx('click');
    },

    resumeGame() {
      this.overlay = null;
      this.paused = false;
    },

    giveUp() {
      this.world.state = 'lost';
      this.world.endT = 0;
      this.overlay = null;
      this.paused = false;
      this.finish();
    },

    // ---------- Desenho ----------

    draw(g) {
      const w = this.world;
      w.draw(g);
      // Joystick virtual
      if (Input.stick.active) {
        g.save();
        g.globalAlpha = 0.35;
        g.beginPath();
        g.arc(Input.stick.ox, Input.stick.oy, 46, 0, Math.PI * 2);
        g.strokeStyle = '#ffe9b0';
        g.lineWidth = 2;
        g.stroke();
        g.globalAlpha = 0.55;
        g.beginPath();
        g.arc(Input.stick.ox + Input.stick.x * 46, Input.stick.oy + Input.stick.y * 46, 16, 0, Math.PI * 2);
        g.fillStyle = '#ffe9b0';
        g.fill();
        g.restore();
      }

      // HUD
      const need = Run.xpNeeded(Run.level);
      V.HUD.draw(g, Run.stats, Run.level, Run.xp, need, Run.gold, Run.cardOrder, Run.cards);
      const roomLabel = this.kind === 'boss'
        ? 'Chefe · ' + Run.chapterDef().name
        : `Sala ${Run.step + 1} de ${V.Data.STEPS_PER_CHAPTER} · ${this.kind === 'elite' ? 'Campeão' : 'Combate'}`;
      UI.text(g, roomLabel, 18, 67, { size: 12, weight: 'bold', color: '#e6dcff', shadow: false });
      UI.button(g, { ...PAUSE_BTN, label: 'Pausa', color: '#4a4558', size: 13 });

      // Barra do chefe
      if (this.kind === 'boss' && w.bossRef && !w.bossRef.dead) {
        const b = w.bossRef;
        UI.text(g, b.name, 180, 104, { align: 'center', size: 13, weight: 'bold', color: '#ffd77a', stroke: '#2a1408', strokeW: 4 });
        UI.bar(g, 60, 122, 240, 9, b.hp / b.maxHp, '#ff7a2a', '#b3203a', 'rgba(0,0,0,0.6)');
      }

      // Dica de controles
      if (this.hintT > 0 && w.state === 'play' && !this.overlay) {
        g.globalAlpha = Math.min(1, this.hintT / 2);
        UI.text(g, 'Arraste para mover · a flecha mira sozinha', 180, 582, {
          align: 'center', size: 13, color: '#e9e2ff', shadow: true,
        });
        g.globalAlpha = 1;
      }

      // Banners de fim de sala
      if (w.state === 'won' && w.endT > 0) {
        const msg = this.kind === 'boss' ? 'Chefe derrotado!' : 'Sala limpa!';
        UI.panel(g, 50, 280, 260, 56, { fill: 'rgba(10,6,20,0.85)', stroke: '#ffd77a', r: 14 });
        UI.text(g, msg, 180, 296, { align: 'center', size: 22, weight: 'bold', color: '#ffe9b0', shadow: false });
      }
      if (w.state === 'lost') {
        g.fillStyle = 'rgba(40,0,10,0.35)';
        g.fillRect(0, 0, 360, 640);
      }

      if (this.overlay === 'levelup') this.drawLevelUp(g);
      if (this.overlay === 'pause') this.drawPause(g);
    },

    drawLevelUp(g) {
      g.fillStyle = 'rgba(4,2,10,0.7)';
      g.fillRect(0, 0, 360, 640);
      UI.panel(g, 14, 120, 332, 440, { fill: 'rgba(14,9,28,0.96)', stroke: '#ffd77a', lw: 2.5, r: 18 });
      UI.title(g, 'Nível ' + Run.level, 180, 138, { align: 'center', size: 26 });
      UI.text(g, 'Escolha um aprimoramento', 180, 172, { align: 'center', size: 13, color: '#c9b6ff', shadow: false });
      for (const r of this.levelCardRects()) {
        const c = r.card;
        const col = V.Data.rarityColor[c.rarity];
        UI.panel(g, r.x, r.y, r.w, r.h, { fill: 'rgba(24,16,44,0.95)', stroke: col, lw: 2.5, r: 14 });
        UI.icon(g, c.icon, r.x + 40, r.y + 44, 40);
        UI.text(g, c.name, r.x + 80, r.y + 14, { size: 18, weight: 'bold', color: '#fff7e0', shadow: false });

      this.pauseBtns = [
        { id: 'resume', x: 90, y: 270, w: 180, h: 46, label: 'Continuar', color: '#2f9e8a' },

        { id: 'quit', x: 90, y: 390, w: 180, h: 46, label: 'Desistir da run', color: '#8a3a4a' },

      for (const b of this.pauseBtns) UI.button(g, b);
      UI.text(g, 'Desistir conta como derrota, mas as Relíquias são mantidas.', 180, 448, {
        align: 'center', size: 11, maxW: 210, lineH: 14, color: '#b7aed0', shadow: false,

    onPointer(type, x, y) {

          if (UI.hit(r, x, y)) {
            Audio.sfx('select');
            this.chooseCard(r.card);

        for (const b of this.pauseBtns) {
          if (!UI.hit(b, x, y)) continue;

          if (b.id === 'resume') this.resumeGame();

            Audio.setEnabled(!Audio.enabled);
            this.overlay = 'pause';
          } else if (b.id === 'quit') this.giveUp();
          return;
        }
        return;

      if (UI.hit(PAUSE_BTN, x, y)) this.pauseGame();

    onKey(code, down) {
      if (!down) return;
      if (code === 'KeyP' || code === 'Escape') {
        if (this.overlay === 'pause') this.resumeGame();

/* js/scenes/event.js */
// Salas de evento: Tesouro (escolher 1 de 3 cartas), Descanso (curar) e Mercador (comprar com ouro).
(() => {
  const V = (window.V = window.V || {});
  const { UI, Audio, Run } = V;

  const Event = {
    type: 'rest',
    t: 0,
    cards: [],
    offers: [],
    healed: false,
    done: false,
    leaveBtn: { x: 90, y: 548, w: 180, h: 46 },

    enter(data) {
      this.type = data.type || 'rest';
      this.t = 0;
      this.healed = false;
      this.done = false;
      this.cards = [];
      this.offers = [];
      if (!Run.active) {
        V.Game.go('title');
        return;
      }
      if (this.type === 'treasure') {
        this.cards = Run.randomCards(3);
        if (!this.cards.length) this.type = 'rest';
      }
      if (this.type === 'shop') this.buildShop();
      Audio.playTrack('shop');
      V.Game.saveRun();
    },

    buildShop() {
      const rare = Run.randomCards(1, 'rare')[0] || Run.randomCards(1)[0];
      this.offers = [
        { id: 'potion', label: 'Poção de Vida', desc: 'Recupera 40 HP imediatamente.', cost: 25, icon: 'hp', color: '#ff6b6b' },
        { id: 'card', label: rare ? rare.name : 'Carta Misteriosa', desc: rare ? rare.desc : 'Nenhuma carta disponível.', cost: 60, icon: rare ? rare.icon : 'relic', color: '#c79bff', card: rare },
        { id: 'maxhp', label: 'Coração Forte', desc: '+15 HP máximo e cura de 15.', cost: 40, icon: 'heart', color: '#ff8fa3' },
      ];
    },

    leave() {
      if (this.done) return;
      this.done = true;
      Run.advance();
      V.Game.saveRun();
      V.Game.go('map', {});
    },

    update(dt) {
      this.t += dt;
    },

    draw(g) {
      const ch = Run.chapterDef();
      UI.backdrop(g, 360, 640, ch.bg[0], ch.bg[1]);
      UI.stars(g, 360, 640, this.t, 45, 31);
      V.HUD.draw(g, Run.stats, Run.level, Run.xp, Run.xpNeeded(Run.level), Run.gold, Run.cardOrder, Run.cards);

      const info = {
        treasure: { title: 'Tesouro', text: 'Um baú antigo repousa sobre a pedra. Três bênçãos brilham dentro dele. Escolha uma.' },
        rest: { title: 'Descanso', text: 'Uma fogueira mansa crepita. Por um instante, o silêncio parece gentil.' },
        shop: { title: 'Mercador', text: 'Gorm, ou alguém parecido com ele, abre a capa e mostra o que tem a oferecer.' },
      }[this.type];

      UI.title(g, info.title, 180, 112, { align: 'center', size: 26 });
      UI.text(g, info.text, 180, 150, { align: 'center', size: 14, maxW: 296, lineH: 20, color: '#e8e2f5', font: 'Georgia, serif' });
      UI.text(g, `Ouro: ${Run.gold}`, 180, 204, { align: 'center', size: 14, weight: 'bold', color: '#ffd54a', shadow: false });

      if (this.type === 'treasure') {
        this.cardRects().forEach((r) => this.drawCard(g, r, r.card));
      } else if (this.type === 'rest') {
        this.drawRest(g);
      } else if (this.type === 'shop') {
        this.offerRects().forEach((r) => this.drawOffer(g, r));
      }

      if (this.type !== 'treasure') {
        const canLeave = this.type !== 'rest' || this.healed;
        if (canLeave) UI.button(g, { ...this.leaveBtn, label: 'Seguir caminho', color: '#2f9e8a' });
      }
    },

    cardRects() {
      return this.cards.map((c, i) => ({ x: 24, y: 236 + i * 118, w: 312, h: 104, card: c }));
    },

    drawCard(g, r, c) {
      const col = V.Data.rarityColor[c.rarity];
      UI.panel(g, r.x, r.y, r.w, r.h, { fill: 'rgba(24,16,44,0.95)', stroke: col, lw: 2.5, r: 14 });
      UI.icon(g, c.icon, r.x + 42, r.y + 50, 42);
      UI.text(g, c.name, r.x + 84, r.y + 16, { size: 18, weight: 'bold', color: '#fff7e0', shadow: false });
      UI.text(g, V.Data.rarityName[c.rarity], r.x + r.w - 14, r.y + 18, { size: 11, align: 'right', weight: 'bold', color: col, shadow: false });
      UI.text(g, c.desc, r.x + 84, r.y + 42, { size: 13, maxW: r.w - 100, lineH: 17, color: '#e8e2f5', shadow: false });
    },

    drawRest(g) {
      const pulse = 1 + Math.sin(this.t * 4) * 0.05;
      g.beginPath();
      g.arc(180, 300, 60 * pulse, 0, Math.PI * 2);
      g.fillStyle = 'rgba(255,160,70,0.25)';
      g.fill();
      UI.icon(g, 'fire', 180, 300, 90 * pulse);
      if (!this.healed) {
        UI.button(g, { x: 60, y: 400, w: 240, h: 50, label: 'Descansar (+35% HP)', color: '#c25a2a' });
      } else {
        UI.text(g, 'Você está mais forte. A jornada continua.', 180, 400, { align: 'center', size: 15, color: '#9ff0c0', maxW: 280, lineH: 20 });
      }
    },

    offerRects() {
      return this.offers.map((o, i) => ({ x: 18, y: 230 + i * 96, w: 324, h: 84, offer: o, index: i }));
    },

    drawOffer(g, r) {
      const o = r.offer;
      const sold = o.sold;
      const afford = Run.gold >= o.cost && !sold;
      UI.panel(g, r.x, r.y, r.w, r.h, {
        fill: sold ? 'rgba(20,20,24,0.9)' : 'rgba(24,16,44,0.95)',
        stroke: sold ? '#55506a' : o.color,
        lw: 2.5,
        r: 14,
      });
      UI.icon(g, o.icon, r.x + 40, r.y + 42, 36);
      UI.text(g, o.label, r.x + 74, r.y + 12, { size: 17, weight: 'bold', color: sold ? '#7a7490' : '#fff7e0', shadow: false });
      UI.text(g, o.desc, r.x + 74, r.y + 36, { size: 12, maxW: 180, lineH: 15, color: sold ? '#6a6480' : '#e8e2f5', shadow: false });
      const label = sold ? 'Vendido' : `${o.cost} ouro`;
      const bx = r.x + r.w - 100;
      UI.button(g, {
        x: bx, y: r.y + 24, w: 84, h: 38, label, color: sold ? '#3a3548' : afford ? '#b5833a' : '#4a4558', size: 14, disabled: !afford && !sold,
      });
    },

    onPointer(type, x, y) {
      if (type !== 'down') return;
      if (this.type === 'treasure') {
        for (const r of this.cardRects()) {
          if (!UI.hit(r, x, y)) continue;
          Audio.sfx('select');
          Run.pickCard(r.card);
          this.leave();
          return;
        }
        return;
      }
      if (this.type === 'rest') {
        if (!this.healed && UI.hit({ x: 60, y: 400, w: 240, h: 50 }, x, y)) {
          const s = Run.stats;
          s.hp = Math.min(s.maxHp, s.hp + Math.round(s.maxHp * 0.35));
          this.healed = true;
          Audio.sfx('heal');
          return;
        }
      }
      if (this.type === 'shop') {
        for (const r of this.offerRects()) {
          if (!UI.hit({ x: r.x + r.w - 100, y: r.y + 24, w: 84, h: 38 }, x, y)) continue;
          this.buy(r.offer);
          return;
        }
      }
      if (this.type !== 'treasure' && (this.type !== 'rest' || this.healed) && UI.hit(this.leaveBtn, x, y)) {
        this.leave();
      }
    },

    buy(o) {
      if (o.sold || Run.gold < o.cost) {
        Audio.sfx('deny');
        return;
      }
      const s = Run.stats;
      Run.gold -= o.cost;
      if (o.id === 'potion') s.hp = Math.min(s.maxHp, s.hp + 40);
      else if (o.id === 'maxhp') {
        s.maxHp += 15;
        s.hp = Math.min(s.maxHp, s.hp + 15);
      } else if (o.id === 'card' && o.card) {
        Run.pickCard(o.card, true);
      }
      o.sold = true;
      Audio.sfx('buy');
    },

    onKey(code, down) {
      if (!down) return;
      if (code === 'Enter' || code === 'Space') {
        if (this.type === 'rest' && !this.healed) {
          this.onPointer('down', 180, 425);
          return;
        }
        this.leave();
      }
    },
  };

  V.Scenes = V.Scenes || {};
  V.Scenes.event = Event;
})();

</script>

// Altar das Relíquias: melhorias permanentes compradas com Relíquias (persistem entre runs).
(() => {

  const Altar = {

      Audio.playTrack('title');

      UI.title(g, 'Altar das Relíquias', 180, 38, { align: 'center', size: 24 });
      UI.text(g, 'Relíquias guardadas: ' + Meta.relics, 180, 74, {
        align: 'center', size: 16, weight: 'bold', color: '#c9a0ff',
      });
      UI.text(g, 'Melhorias valem para todas as próximas jornadas.', 180, 96, {

      });

      this.rows = V.Data.metaUpgrades.map((def, i) => ({ def, x: 16, y: 124 + i * 88, w: 328, h: 78 }));
      for (const r of this.rows) {
        const def = r.def;
        const lv = Meta.level(def.id);
        const maxed = lv >= def.max;
        const cost = maxed ? 0 : V.Data.metaCost(def, lv);
        const can = !maxed && Meta.relics >= cost;
        UI.panel(g, r.x, r.y, r.w, r.h, { fill: 'rgba(20,13,36,0.94)', stroke: can ? '#c79bff' : 'rgba(199,155,255,0.3)', lw: 2, r: 14 });
        UI.icon(g, def.icon, r.x + 32, r.y + 34, 32);
        UI.text(g, def.name, r.x + 60, r.y + 10, { size: 17, weight: 'bold', color: '#fff7e0', shadow: false });
        UI.text(g, def.desc(lv), r.x + 60, r.y + 32, { size: 12, color: '#d8cff0', maxW: 170, lineH: 15, shadow: false });
        // Pontos de nível
        for (let k = 0; k < def.max; k++) {
          g.beginPath();
          g.arc(r.x + 66 + k * 14, r.y + 62, 4.5, 0, Math.PI * 2);
          g.fillStyle = k < lv ? '#c79bff' : 'rgba(255,255,255,0.15)';
          g.fill();
        }
        const label = maxed ? 'Máximo' : `${cost} Rel.`;
        UI.button(g, {
          x: r.x + r.w - 96, y: r.y + 20, w: 82, h: 38, label, color: maxed ? '#3a3548' : can ? '#7a4fd6' : '#4a4558', size: 14, disabled: !can,
        });
      }
      UI.button(g, { ...this.back, label: 'Voltar', color: '#4a4558' });
    },

    onPointer(type, x, y) {
      if (type !== 'down') return;
      if (UI.hit(this.back, x, y)) {
        Audio.sfx('click');
        V.Game.go('title');
        return;
      }
      for (const r of this.rows) {
        if (!UI.hit({ x: r.x + r.w - 96, y: r.y + 20, w: 82, h: 38 }, x, y)) continue;
        if (Meta.buy(r.def.id)) Audio.sfx('buy');
        else Audio.sfx('deny');
        return;
      }
    },

    onKey(code, down) {
      if (down && code === 'Escape') V.Game.go('title');
    },
  };

  V.Scenes = V.Scenes || {};
  V.Scenes.altar = Altar;
})();

// Fim de jornada (derrota ou vitória): resumo, Relíquias ganhas e recomeço.
(() => {
  const V = (window.V = window.V || {});
  const { UI, Audio, Run, Meta } = V;

  const GameOver = {
    t: 0,
    victory: false,
    summary: null,
    quote: '',
    btns: [],

    enter(data) {
      this.t = 0;
      this.victory = !!data.victory;
      if (Run.active) {
        const relics = Run.relicsOnEnd(this.victory);
        const chapterReached = this.victory ? V.Data.chapters.length : Run.chapter + 1;
        this.summary = {
          chapter: chapterReached,
          kills: Run.kills,
          gold: Run.gold,
          level: Run.level,
          relics,
          rooms: Run.roomsCleared,
        };
        Meta.addRelics(relics);
        Meta.best.chapter = Math.max(Meta.best.chapter || 0, chapterReached);
        Meta.best.kills = Math.max(Meta.best.kills || 0, Run.kills);
        if (this.victory) Meta.best.wins = (Meta.best.wins || 0) + 1;
        Meta.save();
        Run.active = false;
        V.Game.clearRun();
      } else {
        this.summary = this.summary || { chapter: 1, kills: 0, gold: 0, level: 1, relics: 0, rooms: 0 };
      }
      const q = V.Data.story.defeat;
      this.quote = this.victory ? '' : V.Util.makeRng((Date.now() / 1000) | 0).pick(q);

    canvas: null,
    g: null,
    k: 1,
    ox: 0,
    oy: 0,
    dpr: 1,
    cssW: W,
    cssH: H,
    last: 0,
    t: 0,

    register(name, scene) {
      this.scenes[name] = scene;
    },

    go(name, data) {
      const next = this.scenes[name];
      if (!next) throw new Error('Cena desconhecida: ' + name);
      if (this.cur && this.cur.exit) this.cur.exit();
      this.curName = name;
      this.cur = next;
      next.enter && next.enter(data || {});
    },

    // Converte coordenadas da janela para coordenadas lógicas (360×640).
    toLogical(cx, cy) {
      const r = this.canvas.getBoundingClientRect();
      return {
        x: (cx - r.left - this.ox) / this.k,
        y: (cy - r.top - this.oy) / this.k,
      };
    },

    resize() {
      const dpr = Math.min(2.5, window.devicePixelRatio || 1);
      const cw = window.innerWidth;
      const ch = window.innerHeight;
      this.dpr = dpr;
      this.cssW = cw;
      this.cssH = ch;
      this.canvas.style.width = cw + 'px';
      this.canvas.style.height = ch + 'px';
      this.canvas.width = Math.round(cw * dpr);
      this.canvas.height = Math.round(ch * dpr);
      this.k = Math.min(cw / W, ch / H);
      this.ox = (cw - W * this.k) / 2;
      this.oy = (ch - H * this.k) / 2;
    },

    frame(ts) {
      const dt = Math.min(0.05, Math.max(0, (ts - this.last) / 1000 || 0.016));
      this.last = ts;
      this.t += dt;
      const g = this.g;
      try {
        if (this.cur && this.cur.update) this.cur.update(dt);
      } catch (err) {
        this.report(err);
      }
      g.setTransform(1, 0, 0, 1, 0, 0);
      g.fillStyle = '#07050c';
      g.fillRect(0, 0, this.canvas.width, this.canvas.height);
      g.setTransform(this.dpr * this.k, 0, 0, this.dpr * this.k, this.dpr * this.ox, this.dpr * this.oy);
      g.save();
      g.beginPath();
      g.rect(0, 0, W, H);
      g.clip();
      try {
        if (this.cur && this.cur.draw) this.cur.draw(g);
      } catch (err) {
        this.report(err);
      }
      g.restore();
      V.Input.clearFrame();
      requestAnimationFrame((t) => this.frame(t));
    },

    // Relata erros de quadro uma única vez por mensagem, sem parar o loop.
    report(err) {
      const key = String(err && err.message);
      if (!this._reported) this._reported = new Set();
      if (this._reported.has(key)) return;
      this._reported.add(key);
      console.error('[Vaelmor]', err);
    },

    start(startScene) {
      this.canvas = document.getElementById('game');
      this.g = this.canvas.getContext('2d');
      this.resize();
      window.addEventListener('resize', () => this.resize());
      V.Input.init(
        this.canvas,
        (cx, cy) => this.toLogical(cx, cy),
        (code, down, e) => {
          if (down) V.Audio.unlock();
          if (this.cur && this.cur.onKey) this.cur.onKey(code, down, e);
        },
        (type, x, y) => {
          if (type === 'down') V.Audio.unlock();
          if (this.cur && this.cur.onPointer) this.cur.onPointer(type, x, y);
        }
      );
      this.go(startScene);
      requestAnimationFrame((t) => {
        this.last = t;
        this.frame(t);
      });
    },

    // Salva a run atual (ou remove o salvamento se não houver run ativa).
    saveRun() {
      if (V.Run.active) V.Util.store.set('run', V.Run.serialize());
    },

    clearRun() {
      V.Util.store.set('run', null);
    },

    hasSavedRun() {
      const d = V.Util.store.get('run', null);
      return !!(d && typeof d === 'object' && d.stats && d.stats.hp > 0);
    },
  };

  V.Game = Game;
})();

</script>
  <script>
/* js/main.js */
// Inicialização: carrega progresso, registra as cenas e inicia o loop.
(() => {
  const V = window.V;

  V.Meta.load();
  V.Audio.enabled = V.Util.store.get('sound', true);

  const scenes = V.Scenes;
  const names = ['title', 'story', 'map', 'gameplay', 'event', 'altar', 'gameover', 'credits'];
  for (const n of names) V.Game.register(n, scenes[n]);

  // Evita que o navegador role a página em dispositivos de toque.
  document.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });

  V.Game.start('title');
})();

</script>
