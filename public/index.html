<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#151515">
  <title>Mototáxi da Cidade</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/shared/estilo.css">
</head>
<body>
  <div class="inicio">
    <header>
      <img src="/icon.svg" alt="" width="72" height="72">
      <h1>Mototáxi em <em id="cidade">sua cidade</em></h1>
      <p>Peça uma moto em poucos toques. Rápido, com preço na tela antes de confirmar.</p>
    </header>
    <nav aria-label="Escolha como entrar">
      <div>
        <a class="acesso destaque" href="/passageiro/">
          <div class="emoji" aria-hidden="true">🧍</div>
          <div><strong>Quero uma corrida</strong><span>Sou passageiro</span></div>
        </a>
        <a class="acesso" href="/motoqueiro/">
          <div class="emoji" aria-hidden="true">🏍️</div>
          <div><strong>Sou motoqueiro</strong><span>Receber corridas</span></div>
        </a>
        <a class="acesso" href="/central/">
          <div class="emoji" aria-hidden="true">🖥️</div>
          <div><strong>Central</strong><span>Painel de controle</span></div>
        </a>
        <p class="dica">Dica: no celular, use “Adicionar à tela inicial” para instalar como aplicativo.</p>
      </div>
    </nav>
  </div>
  <script src="/inicio.js"></script>
</body>
</html>
