<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Anel Zero 2D — Dentro do Processador</title>
  <style>
    :root { color-scheme: dark; }
    html, body { margin: 0; min-height: 100%; background: #040306; color: #efe4c9; font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif; }
    body {
      display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 10px; box-sizing: border-box;
      background: radial-gradient(ellipse at 50% 25%, #1d140c 0%, #0a0708 55%, #030204 100%);
    }
    h1 {
      margin: 2px 0 8px; text-align: center; letter-spacing: .04em; color: #f3d88f;
      font: 600 clamp(15px, 3.4vw, 22px) "Palatino Linotype", "Book Antiqua", Palatino, Georgia, serif;
      text-shadow: 0 0 12px rgba(201, 164, 92, .35);
    }
    canvas {
      display: block; width: 100%; max-width: 960px; height: auto; border: 2px solid #5e4520; border-radius: 4px;
      box-shadow: 0 0 0 1px #000, 0 0 36px rgba(0, 0, 0, .9), 0 0 90px rgba(150, 70, 25, .18);
      touch-action: none;
    }
    p.hint { font-size: 12px; color: #998a6e; margin: 10px 0 0; text-align: center; max-width: 960px; }
    .pad {
      display: none; width: 100%; max-width: 720px; margin-top: 12px; gap: 8px 10px;
      grid-template-columns: auto minmax(0, 1fr); align-items: start; user-select: none; -webkit-user-select: none;
    }
    body.touch .pad { display: grid; }
    .dpad { display: grid; grid-template-columns: repeat(3, 58px); grid-template-rows: repeat(3, 52px); gap: 6px; }
    .acoes { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }

    button {
      font: 15px "Trebuchet MS", "Segoe UI", system-ui, sans-serif; color: #f3d88f;
      background: linear-gradient(#2a2016, #120d08); border: 1px solid #7a5d2a; border-radius: 6px;
      box-shadow: inset 0 1px 0 rgba(243, 216, 143, .12), 0 2px 6px rgba(0, 0, 0, .6);
      padding: 8px 6px; min-height: 48px; touch-action: manipulation; -webkit-tap-highlight-color: transparent; cursor: pointer;
      min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    button:active, button.on { background: linear-gradient(#3a2b18, #1c140c); border-color: #f3d88f; }
    button[hidden] { display: none; }
    .up { grid-column: 2; grid-row: 1; }
    .left { grid-column: 1; grid-row: 2; }
    .right { grid-column: 3; grid-row: 2; }
    .down { grid-column: 2; grid-row: 3; }
  </style>
</head>
<body>
  <h1>Anel Zero — Dentro do Processador</h1>
  <canvas id="game" width="960" height="720"></canvas>
  <div id="pad" class="pad" aria-label="Controles de toque">
    <div id="dpad" class="dpad" aria-label="Andar"></div>
    <div id="acoes" class="acoes" aria-label="Ações"></div>
  </div>
  <p class="hint">Setas ou WASD andar · E falar/abrir · R usar · C criar · I inventário · K habilidades · J diário · B bestiário · Tab menu · M mapa · F3 depurar · N novo jogo</p>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
